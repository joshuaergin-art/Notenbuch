/* ================= PIN-Sperre ================= */
// Die PIN gilt nur für dieses Gerät und ist nicht Teil der Sicherung.
const PINKEY = 'notenbuch-pin';
let pinCfg = null; try { pinCfg = JSON.parse(localStorage.getItem(PINKEY)); } catch (e) {}
let locked = false, pinEntry = '', pinFails = 0, pinBlockUntil = 0, hiddenAt = 0;
async function hashPin(pin, salt) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function lockApp() {
  if (!pinCfg) return;
  locked = true; pinEntry = ''; closeSheet(); $('#main').innerHTML = ''; renderLock();
}
function renderLock(msg = '') {
  const el = $('#lock'); el.classList.remove('hidden');
  el.innerHTML = `<div style="font-size:40px">🔒</div><b>Notenbuch Deutsch</b>
    <div class="dots">${Array.from({length: pinCfg.len}, (_, i) => `<i class="${i < pinEntry.length ? 'f' : ''}"></i>`).join('')}</div>
    <div class="msg">${esc(msg)}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-pin="${n}">${n}</button>`).join('')}<button data-pin="forgot" style="font-size:11px">PIN<br>vergessen</button><button data-pin="0">0</button><button data-pin="del">⌫</button></div>`;
}
async function pinKey(k) {
  if (Date.now() < pinBlockUntil) return renderLock(`Zu viele Fehlversuche – bitte ${Math.ceil((pinBlockUntil - Date.now()) / 1000)} s warten`);
  if (k === 'forgot') {
    if (confirm('PIN vergessen?\n\nDie App lässt sich dann nur entsperren, indem ALLE Daten auf diesem Gerät gelöscht werden. Danach kannst du deine letzte Sicherung laden.') && confirm('Wirklich alle Daten auf diesem Gerät löschen?')) {
      localStorage.removeItem(KEY); localStorage.removeItem(PINKEY); location.reload();
    }
    return;
  }
  if (k === 'del') pinEntry = pinEntry.slice(0, -1); else if (pinEntry.length < pinCfg.len) pinEntry += k;
  if (pinEntry.length === pinCfg.len) {
    const ok = (await hashPin(pinEntry, pinCfg.salt)) === pinCfg.hash;
    pinEntry = '';
    if (ok) { locked = false; pinFails = 0; $('#lock').classList.add('hidden'); $('#lock').innerHTML = ''; render(); return; }
    pinFails++; if (pinFails >= 5) pinBlockUntil = Date.now() + 30000 * (pinFails - 4);
    return renderLock('Falsche PIN');
  }
  renderLock();
}
document.addEventListener('click', e => { const b = e.target.closest('[data-pin]'); if (b && locked) pinKey(b.dataset.pin); });
document.addEventListener('keydown', e => { if (!locked) return; if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('del'); });
document.addEventListener('visibilitychange', () => {
  if (!pinCfg || locked) return;
  if (document.hidden) { hiddenAt = Date.now(); if (!+pinCfg.lockAfter) lockApp(); }
  else if (hiddenAt && Date.now() - hiddenAt >= (+pinCfg.lockAfter || 0) * 60000) lockApp();
});

    const key = $('#ai-key').value.trim();
    if (!/^sk-ant-/.test(key)) return alert('Das sieht nicht wie ein Anthropic-API-Schlüssel aus (beginnt mit „sk-ant-“).');
    aiCfg = {on: true, key}; localStorage.setItem(AIKEY, JSON.stringify(aiCfg)); render(); toast('KI eingeschaltet');
  },
  aioff: () => { if (!confirm('KI ausschalten und API-Schlüssel von diesem Gerät löschen?')) return; aiCfg = null; localStorage.removeItem(AIKEY); render(); },
  note: d => {
    const L = db.lessons[ui.lesson] || {}, c = cls(ui.lesson.split('|')[0]), s = c.students.find(x => x.id === d.s);
    ui.noteSid = d.s;
    showSheet(`<div class="row"><b class="grow" style="font-size:18px">📝 ${esc(s.name)}</b><button class="btn sm" data-act="closesheet">✕</button></div>
      <div class="small muted" style="margin:4px 0 8px">${fmtD(L.date || ui.lesson.split('|')[1])} · ${esc(c.name)}</div>
      <textarea id="note-ta" style="min-height:110px" placeholder="z. B. sehr gute Beteiligung, störte, Elterngespräch …">${esc((L.notes || {})[d.s] || '')}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn pri grow" data-act="savenote">Speichern</button><button class="btn danger" data-act="savenote" data-clear="1">Löschen</button></div>`);
    setTimeout(() => $('#note-ta').focus(), 50);
  },
  savenote: d => { const L = ensureLesson(ui.lesson), t = d.clear ? '' : $('#note-ta').value.trim(); if (t) { L.notes[ui.noteSid] = t; L.status = ''; } else delete L.notes[ui.noteSid]; save(); closeSheet(); render(); },
  status: d => { const L = ensureLesson(ui.lesson); L.status = L.status === d.s ? '' : d.s; save(); render(); },
  ausfallkey: d => { ensureLesson(d.k).status = 'ausfall'; save(); render(); openListSheet(); },
  dellesson: () => { if (!confirm('Diese Stunde mit allen Einträgen löschen?')) return; delete db.lessons[ui.lesson]; db.deleted.lessons[ui.lesson] = Date.now(); ui.lesson = null; save(); render(); },
  openlist: () => openListSheet(),
  addlesson: d => { if (d.d) ui.date = d.d; addLessonSheet(); },
  addlesson2: () => { const k = lk($('#al-c').value, ui.date, +$('#al-p').value); ensureLesson(k).extra = true; save(); closeSheet(); ui.lesson = k; render(); },
  student: d => studentSheet(d.s),
  exam: d => { ui.examId = d.e; window.scrollTo(0, 0); render(); },
  addexam: () => { const c = curCls(), n = c.exams.length + 1; const e = {id: uid(), title: 'KA ' + n, quarter: 'Q1', date: '', weight: 1}; c.exams.push(e); save(); ui.examId = e.id; render(); },
  delexam: () => { const c = curCls(); if (!confirm('Klassenarbeit mit allen Noten löschen?')) return; c.exams = c.exams.filter(e => e.id !== ui.examId); delete db.examGrades[ui.examId]; db.deleted.exams[ui.examId] = Date.now(); ui.examId = null; save(); render(); },
  addclass: () => { const n = prompt('Name der neuen Lerngruppe:'); if (!n) return; const c = newClass(n.trim()); db.classes.push(c); ui.cls = c.id; save(); render(); },
  delclass: async () => { const c = curCls(); if (!confirm(`Lerngruppe „${c.name}“ mit ALLEN Noten löschen?`)) return; await snapAdd(`Vor dem Löschen von ${c.name}`); db.deleted.classes[c.id] = Date.now(); db.classes = db.classes.filter(x => x.id !== c.id); for (const [k, L] of Object.entries(db.lessons)) if (L.classId === c.id) delete db.lessons[k]; for (const e of c.exams) delete db.examGrades[e.id]; ui.cls = db.classes[0]?.id; save(); render(); },
  tt: d => { const c = curCls(), w = +d.w, p = +d.p, i = c.timetable.findIndex(t => t.wd === w && t.p === p); if (i >= 0) c.timetable.splice(i, 1); else c.timetable.push({wd: w, p}); save(); render(); },
  addhol: () => { db.settings.holidays.push({start: today(), end: today(), name: ''}); save(); render(); },
  delhol: d => { db.settings.holidays.splice(+d.i, 1); save(); render(); },
  ics: () => exportIcs(),
  share: () => shareBackup(),
  download: async () => { const f = await backupFile(false); downloadBlob(f, f.name); markBackup(); },
  setenc: async () => {
    const a = $('#enc1').value, b = $('#enc2').value;
    if (a.length < 8) return alert('Bitte mindestens 8 Zeichen verwenden.');
    if (a !== b) return alert('Die beiden Eingaben stimmen nicht überein.');
    const salt = b64e(crypto.getRandomValues(new Uint8Array(16)));
    encCfg = {salt, iter: ENC_ITER, key: await deriveKeyRaw(a, salt, ENC_ITER)};
    localStorage.setItem(ENCKEY, JSON.stringify(encCfg)); render();
    toast('Verschlüsselung eingeschaltet – bitte jetzt eine neue Sicherung erstellen');
  },
  delenc: () => { if (!confirm('Verschlüsselung ausschalten? Neue Sicherungen sind dann wieder für jeden lesbar, der die Datei öffnet.')) return; encCfg = null; localStorage.removeItem(ENCKEY); render(); },
  import: () => $('#importfile').click(),
  xlsx: () => exportXlsx(),
  wipe: async () => { if (!confirm('Wirklich ALLE Daten auf diesem Gerät löschen?')) return; if (!confirm('Sicher? Vorher wird ein Wiederherstellungspunkt angelegt.')) return; await snapAdd('Vor dem Löschen aller Daten'); db = migrate(defaults()); saveQuiet(); ui.cls = db.classes[0].id; render(); },
  closesheet: () => closeSheet(),
};

const CHG = {
  jump: el => { if (el.value) jumpTo(el.value); },
  topic: el => { ensureLesson(ui.lesson).topic = el.value; save(); },
  override: el => { setOverride(curCls(), el.dataset.s, el.dataset.q, el.value); save(); render(); studentSheet(el.dataset.s); },
  exam: el => { const e = curCls().exams.find(x => x.id === ui.examId), f = el.dataset.f; e[f] = f === 'weight' ? (Math.max(0.5, +el.value || 1)) : el.value; if (f === 'date' && el.value && quarterOf(el.value)) e.quarter = quarterOf(el.value); save(); render(); },
  cname: el => { if (el.value.trim()) { curCls().name = el.value.trim(); save(); render(); } },
  students: el => {
    const c = curCls(), names = [...new Set(el.value.split('\n').map(s => s.trim()).filter(Boolean))];
    const byName = new Map(c.students.map(s => [s.name, s]));
    const removed = c.students.filter(s => !names.includes(s.name)), added = names.filter(n => !byName.has(n));
    if (removed.length && removed.length === added.length && confirm('Als Umbenennung übernehmen (Noten bleiben erhalten)?\n\n' + removed.map((s, i) => `${s.name} → ${added[i]}`).join('\n'))) {
      removed.forEach((s, i) => { s.name = added[i]; byName.set(added[i], s); });
    } else if (removed.length && !confirm(`Entfernen: ${removed.map(s => s.name).join(', ')}\nIhre Noten werden nicht mehr angezeigt. Fortfahren?`)) { render(); return; }
    c.students = names.map(n => byName.get(n) || {id: uid(), name: n});
    for (const s of removed) if (!c.students.some(x => x.id === s.id)) db.deleted.students[s.id] = Date.now();
    save(); render(); toast(`${c.students.length} Schüler:innen gespeichert`);
  },
  set: el => { const f = el.dataset.f; db.settings[f] = f === 'oralWeight' ? Math.min(100, Math.max(0, +el.value || 0)) : ['remOffset', 'warnMinGrades', 'warnMat', 'warnLate', 'warnDist'].includes(f) ? Math.max(0, +el.value || 0) : el.value; save(); render(); },
  quarter: el => { db.settings.quarters[+el.dataset.i][el.dataset.f] = el.value; save(); render(); },
  talk: el => { const c = curCls(), t = c.talk[el.dataset.s]; if (t) { t.text = el.value; save(); } },
  theme: el => { localStorage.setItem('notenbuch-theme', el.value); applyTheme(); },
  sinfo: el => { const s = curCls().students.find(x => x.id === el.dataset.s); if (s) { s.info = el.value.trim(); save(); render(); } },
  lockafter: el => { pinCfg.lockAfter = +el.value; localStorage.setItem(PINKEY, JSON.stringify(pinCfg)); },
  hol: el => { db.settings.holidays[+el.dataset.i][el.dataset.f] = el.value; save(); },
};

/* ---------- Rückgängig: merkt sich den Stand vor jedem Eintrag ---------- */
const UNDO_ACTS = new Set(['smile', 'abs', 'mat', 'late', 'dist', 'picksmile', 'savenote', 'status', 'setgrade']);
let undoState = null;
function captureUndo(act) {
  const clone = x => x == null ? null : JSON.parse(JSON.stringify(x));
  if (act === 'setgrade' && ui.pick && ui.pick.kind === 'exam') return {type: 'exam', id: ui.examId, sid: ui.pick.sid, before: clone(db.examGrades[ui.examId])};
  if (!ui.lesson) return null;
  return {type: 'lesson', key: ui.lesson, sid: ui.pick ? ui.pick.sid : ui.noteSid, before: clone(db.lessons[ui.lesson])};
}
function undoMessage(act, d, u) {
  const c = u.type === 'lesson' ? cls(u.key.split('|')[0]) : curCls();
  const sid = d.s || u.sid, s = c && c.students.find(x => x.id === sid), n = s ? firstName(s) : '';
  if (u.type === 'exam') { const g = (db.examGrades[u.id] || {})[sid]; return g ? `${g} für ${n}` : `Note bei ${n} entfernt`; }
  const L = db.lessons[u.key] || {};
  const on = f => !!(L[f] || {})[sid];
  switch (act) {
    case 'smile': case 'picksmile': return L.grades && L.grades[sid] ? `${smiley(L.grades[sid])} für ${n}` : `Smiley bei ${n} entfernt`;
    case 'abs': return on('absent') ? `${n}: krank` : `${n}: nicht mehr krank`;
    case 'late': return on('late') ? `${n}: verspätet` : `${n}: Verspätung entfernt`;
    case 'dist': return on('dist') ? `${n}: Störung vermerkt` : `${n}: Störung entfernt`;
    case 'mat': return on('mat') ? `${n}: Material vergessen` : `${n}: Material-Eintrag entfernt`;
    case 'savenote': return on('notes') ? `Notiz bei ${n} gespeichert` : `Notiz bei ${n} gelöscht`;
    case 'status': return L.status === 'ausfall' ? 'Stunde als Ausfall markiert' : L.status === 'ohne' ? 'Stunde ohne Noten markiert' : 'Markierung entfernt';
  }
  return 'Eintrag geändert';
}
ACT.undo = () => {
  const u = undoState; if (!u) return;
  if (u.type === 'lesson') { if (u.before) db.lessons[u.key] = u.before; else delete db.lessons[u.key]; }
  else { if (u.before) db.examGrades[u.id] = u.before; else delete db.examGrades[u.id]; db.examMt[u.id] = Date.now(); }
  undoState = null; save(); closeSheet(); render();
  document.querySelectorAll('.toast').forEach(x => x.remove()); toast('Rückgängig gemacht');
};

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t || !ACT[t.dataset.act]) return;
  const act = t.dataset.act, u = UNDO_ACTS.has(act) ? captureUndo(act) : null;
  // Vergleich ohne Zeitstempel; eine leere Stunde zählt wie „nicht vorhanden“
  const norm = x => (x == null || (u.type === 'lesson' && !lessonDone(x) && !x.topic) || (u.type === 'exam' && !Object.keys(x).length)) ? 'null' : JSON.stringify(x, (k, v) => k === 'mt' ? undefined : v);
  const beforeJson = u ? norm(u.before) : null;
  await ACT[act](t.dataset, t, e);
  if (u && norm(u.type === 'lesson' ? db.lessons[u.key] : db.examGrades[u.id]) !== beforeJson) { undoState = u; toast(undoMessage(act, t.dataset, u), true); }
});
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t && CHG[t.dataset.chg]) CHG[t.dataset.chg](t); });
window.addEventListener('focus', () => { if (ui.tab === 'heute' && !ui.lesson) render(); });

/* ================= Start ================= */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js');
  // Neue App-Version wurde installiert → einmal neu laden (Daten bleiben erhalten)
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { const sheetOpen = !$('#sheet').classList.contains('hidden');
    if (hadController && !reloaded && !sheetOpen) { reloaded = true; location.reload(); } });
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
if (pinCfg) lockApp(); else render();
// Dropbox: Rückkehr von der Anmeldung verarbeiten, dann abgleichen – beim Öffnen, beim Zurückkehren, bei Internet, alle 5 Min.
updSyncUi();
dbxHandleRedirect().then(() => syncNow(false));
document.addEventListener('visibilitychange', () => { if (!dbxOn()) return; if (document.hidden) { if (dbx.dirty) syncNow(false); } else syncNow(false); });
window.addEventListener('online', () => syncNow(false));
setInterval(() => syncNow(false), 5 * 60000);
// täglicher Wiederherstellungspunkt (einmal pro Tag beim ersten Öffnen)
if (localStorage.getItem('notenbuch-lastsnap') !== today()) snapAdd('Täglich (automatisch)');
// Ferien-Ergänzung beim ersten Start mit dieser Version dauerhaft speichern
if (!JSON.parse(localStorage.getItem(KEY) || '{}').settings?.nrwAdded && hasData()) saveQuiet();
</script>
