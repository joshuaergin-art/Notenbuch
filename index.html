<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Notenbuch Deutsch</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--pri:#1e40af;--pri2:#dbeafe;--warn:#b45309;--warnbg:#fef3c7;--ok:#047857;--okbg:#d1fae5;--bad:#b91c1c;--badbg:#fee2e2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;background:#1e3a8a;color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top .muted{color:#c7d2fe;font-size:12px}
main{padding:12px 12px 96px;max-width:760px;margin:0 auto}
main.wide{max-width:none}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:8px 0 6px;font-size:20px;display:flex;flex-direction:column;align-items:center;color:var(--muted)}
.tabs button span{font-size:11px;margin-top:2px}
.tabs button.on{color:var(--pri);font-weight:600;background:#eef2ff}
.card{background:var(--card);border-radius:12px;padding:12px;margin:0 0 10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
h2{font-size:18px;margin:4px 0 10px}
h3{font-size:13px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.danger{color:var(--bad);border-color:#fecaca}
input,select,textarea{font:inherit;border:1px solid #d1d5db;border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink);max-width:100%}
textarea{width:100%;min-height:180px;font-size:15px}
.lesson{display:flex;align-items:center;gap:10px;cursor:pointer}
.per{width:46px;height:46px;flex:none;border-radius:10px;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)} .badge.warn{background:var(--warnbg);color:var(--warn)}
.banner{background:var(--warnbg);color:#78350f;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.banner.ok{background:var(--okbg);color:#065f46}
.slist .st{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.slist .st:last-child{border-bottom:0}
.nr{width:22px;flex:none;color:var(--muted);font-size:13px;text-align:right}
.sub{display:block;font-size:11px;color:var(--muted);font-weight:400}
.chip{min-width:52px;height:42px;border-radius:10px;border:1px dashed #cbd5e1;background:#fff;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;color:var(--muted)}
.chip.has{border-style:solid;color:inherit}
.g1{background:#d1fae5!important;border-color:#6ee7b7!important;color:#065f46!important}
.g2{background:#e0f2fe!important;border-color:#7dd3fc!important;color:#075985!important}
.g3{background:#fef9c3!important;border-color:#fde047!important;color:#713f12!important}
.g4{background:#ffedd5!important;border-color:#fdba74!important;color:#7c2d12!important}
.g5{background:#fee2e2!important;border-color:#fca5a5!important;color:#7f1d1d!important}
.hw{width:48px;height:42px;flex:none;border-radius:10px;font-size:13px;padding:0;color:var(--muted)}
.hw.y{background:var(--okbg);border-color:#6ee7b7;color:var(--ok);font-size:20px}
.hw.n{background:var(--badbg);border-color:#fca5a5;color:var(--bad);font-size:20px}
.sheet-wrap{position:fixed;inset:0;z-index:20}
.hidden{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;border-radius:16px 16px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 6px}
.ggrid button{height:54px;font-size:21px;font-weight:700}
.ggrid button.cur{outline:3px solid var(--pri);outline-offset:1px}
.tbl-wrap{overflow:auto;background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);max-height:calc(100vh - 230px)}
table.ov{border-collapse:separate;border-spacing:0;font-size:14px;white-space:nowrap}
table.ov th,table.ov td{padding:5px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center}
table.ov thead th{position:sticky;top:0;background:#f8fafc;z-index:2;font-size:12px;font-weight:600}
table.ov thead tr.hj th{font-size:12px;background:#e0e7ff;color:#3730a3}
table.ov thead tr:nth-child(2) th{top:26px}
table.ov .nm{position:sticky;left:0;background:#fff;text-align:left;z-index:1;font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis}
table.ov thead .nm{z-index:3;background:#f8fafc}
table.ov td.calc{background:#f9fafb;color:#374151}
table.ov td.res{background:#ecfdf5}
table.ov td.qres{background:#f0f9ff}
table.ov td.edit{min-width:44px;cursor:pointer}
table.ov tbody tr{cursor:pointer}
table.ov tbody tr:hover td{background:#eef2ff}
table.ov tr.avg td{background:#f1f5f9!important;font-weight:600;cursor:default}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.pills button{white-space:nowrap;border-radius:99px}
.pills button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.ttgrid{border-collapse:collapse;margin-top:6px}
.ttgrid td,.ttgrid th{border:1px solid var(--line);width:46px;height:34px;text-align:center;font-size:12px;padding:0}
.ttgrid td{cursor:pointer}
.ttgrid td.on{background:var(--pri);color:#fff;font-weight:700}
.ttgrid td.other{color:var(--muted);background:#f9fafb}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>label{font-size:13px;color:var(--muted)}
.qgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center}
.qgrid input{width:100%}
.dl{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px}
.dl span{font-size:13px;background:#f3f4f6;border-radius:6px;padding:2px 6px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;display:flex;align-items:center;gap:12px;max-width:92vw;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#syncind{cursor:pointer;font-size:13px;color:#e0e7ff;white-space:nowrap}
.toast-undo{background:none;border:0;color:#93c5fd;font-weight:700;padding:4px 2px;font-size:14px;white-space:nowrap}
p.help{font-size:13px;color:var(--muted);margin:6px 0 10px}
.day{margin-bottom:4px}
.dayhead{position:sticky;top:var(--toph,44px);z-index:3;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 2px 6px;font-size:15px}
.dayhead .btn{padding:2px 10px;font-size:16px;line-height:1.4}
.day.today{border-left:4px solid var(--pri);padding-left:8px;margin-left:-12px}
.day.today .dayhead b{color:var(--pri)}
.day.past .card.lesson{opacity:.85}
.dayhol{background:#ecfeff;color:#155e75;border-radius:10px;padding:8px 12px;margin:8px 0 10px;font-size:14px}
.weeksep{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 2px}
.weeksep::after{content:'';flex:1;border-top:1px solid #d1d5db}
.ag-more{text-align:center;padding:14px;font-size:13px;color:var(--muted)}
.banner.bad{background:#fee2e2;color:#7f1d1d}
.nb{font-size:17px!important;color:var(--muted)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;background:#ede9fe;color:#5b21b6;vertical-align:middle;margin-left:2px;letter-spacing:.02em}
html.dark .tag{background:#2e1f5e;color:#ddd6fe}
.tagpick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tagpick button{font-size:13px;padding:5px 10px;border-radius:99px}
.tagpick button.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
.proto{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.ro-banner{position:sticky;top:var(--toph,44px);z-index:4;background:#7c2d12;color:#fff;padding:8px 12px;border-radius:0 0 10px 10px;margin:-12px -12px 10px;display:flex;align-items:center;gap:8px;font-size:14px}
.nsp{display:flex;align-items:flex-end;gap:2px;height:140px;border-bottom:1px solid var(--line);padding:0 4px}
.nsp-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;outline:none;cursor:default}
.nsp-bar{width:62%;max-width:46px;background:var(--pri);border-radius:4px 4px 0 0;transition:height .2s}
.nsp-val{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:3px}
.nsp-col:hover .nsp-bar,.nsp-col:focus .nsp-bar{filter:brightness(1.15)}
.nsp-col:hover::after,.nsp-col:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#111827;color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:2;pointer-events:none}
.nsp-labs{display:flex;gap:2px;padding:4px 4px 0}
.nsp-labs span{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.stat{flex:1;min-width:92px;background:var(--bg);border-radius:10px;padding:8px 10px}
.stat-v{font-size:22px;font-weight:700;line-height:1.2}
.stat-l{font-size:11px;color:var(--muted);line-height:1.3}
.nsp-table{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
pre.preview{white-space:pre-wrap;background:#f3f4f6;border-radius:8px;padding:8px;font-size:12px;max-height:40vh;overflow:auto}

/* ---------- Dunkelmodus ---------- */
html.dark{--bg:#0b1220;--card:#162032;--ink:#e5e7eb;--muted:#94a3b8;--line:#2a3a52;--pri:#60a5fa;--pri2:#1e3a5f;--okbg:#06331f;--ok:#6ee7b7;--warnbg:#3a2a06;--warn:#fcd34d;--badbg:#3f1010;--bad:#fca5a5;color-scheme:dark}
html.dark .top{background:#0f1b38}
html.dark button,html.dark .btn,html.dark input,html.dark select,html.dark textarea{background:#1c2940;color:var(--ink);border-color:#34465f}
html.dark .btn.pri,html.dark .pills button.on{background:#2563eb;border-color:#2563eb;color:#fff}
html.dark .btn.danger{color:#fca5a5;border-color:#7f1d1d}
html.dark .tabs{background:#101a2c;border-color:var(--line)}
html.dark .tabs button{background:none}
html.dark .tabs button.on{background:#1c2940;color:#93c5fd}
html.dark .card{box-shadow:none;border:1px solid var(--line)}
html.dark .banner{background:#3a2a06;color:#fde68a}
html.dark .banner.ok{background:#06331f;color:#86efac}
html.dark .banner.bad{background:#3f1010;color:#fecaca}
html.dark .sheet{background:var(--card)}
html.dark .chip{background:#1c2940;border-color:#475569}
html.dark .g1{background:#064e3b!important;border-color:#10b981!important;color:#d1fae5!important}
html.dark .g2{background:#0c3b5a!important;border-color:#38bdf8!important;color:#e0f2fe!important}
html.dark .g3{background:#4a3c07!important;border-color:#eab308!important;color:#fef9c3!important}
html.dark .g4{background:#5a2a0a!important;border-color:#f97316!important;color:#ffedd5!important}
html.dark .g5{background:#5c1515!important;border-color:#ef4444!important;color:#fee2e2!important}
html.dark .smb{filter:grayscale(.4);opacity:.85}
html.dark .smb.on{filter:none;opacity:1}
html.dark .ic.on-abs{background:#5c1515;border-color:#ef4444}
html.dark .ic.on-mat{background:#5a2a0a;border-color:#f97316}
html.dark .ic.on-note{background:#27306b;border-color:#818cf8}
html.dark .ic.on-late{background:#4a3c07;border-color:#eab308}
html.dark .notetxt{background:#1e2a55}
html.dark .tbl-wrap{background:var(--card);box-shadow:none;border:1px solid var(--line)}
html.dark table.ov thead th,html.dark table.ov thead .nm{background:#1c2940}
html.dark table.ov thead tr.hj th{background:#1e2a55;color:#c7d2fe}
html.dark table.ov .nm{background:var(--card)}
html.dark table.ov td.calc{background:#18243a;color:var(--ink)}
html.dark table.ov td.res{background:#0d2e22}
html.dark table.ov td.qres{background:#0f2740}
html.dark table.ov tr.avg td{background:#1c2940!important}
html.dark table.ov tbody tr:hover td{background:#1e2a55}
html.dark .ttgrid td.other{background:#131d2f}
html.dark .ttgrid td.on{background:#2563eb}
html.dark .dl span{background:#1c2940}
html.dark .dayhol{background:#0b2f3a;color:#a5f3fc}
html.dark pre.preview{background:#1c2940}
html.dark .badge{background:#2a3a52;color:var(--ink)}
html.dark .badge.ok{background:#06331f;color:#86efac}
html.dark .badge.warn{background:#3a2a06;color:#fcd34d}
html.dark .weeksep::after{border-color:#2a3a52}
.st2{padding:8px 0 10px;border-bottom:1px solid var(--line)}
.st2:last-child{border-bottom:0}
.st2.abs{opacity:.75}
.ic.on-late{background:#fef9c3;border-color:#facc15}
#lock{position:fixed;inset:0;z-index:50;background:#1e3a8a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#lock.hidden{display:none}
#lock .dots{display:flex;gap:14px}
#lock .dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff}
#lock .dots i.f{background:#fff}
#lock .pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
#lock .pad button{height:72px;border-radius:50%;font-size:26px;background:rgba(255,255,255,.14);color:#fff;border:0}
#lock .msg{min-height:20px;color:#fecaca;font-size:14px;text-align:center}
.pick-name{font-size:30px;font-weight:800;text-align:center;margin:10px 0 2px}
.warn-item{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
#print{display:none}
@media print{
  html,body{background:#fff!important}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font:11pt/1.35 Arial,sans-serif}
  .rep{page-break-after:always;break-after:page}
  .rep:last-child{page-break-after:auto;break-after:auto}
  .rep h1{font-size:18pt;margin:0 0 2px}
  .rep h2{font-size:12pt;margin:14px 0 4px}
  .rep table{border-collapse:collapse;width:100%}
  .rep td,.rep th{border:1px solid #888;padding:3px 6px;text-align:left;vertical-align:top}
  .rep th{background:#eee}
}
.icrow{display:flex;gap:3px;flex:none}
.st2 .grow{overflow-wrap:anywhere}
.ic.on-dist{background:#ede9fe;border-color:#a78bfa}
html.dark .ic.on-dist{background:#2e1f5e;border-color:#a78bfa}
.ic{width:40px;height:46px;flex:none;padding:0;border-radius:10px;font-size:18px;line-height:1;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ic span{font-size:8.5px;color:var(--muted)}
.ic.on-abs{background:#fee2e2;border-color:#f87171}
.ic.on-mat{background:#ffedd5;border-color:#fb923c}
.ic.on-note{background:#e0e7ff;border-color:#818cf8}
.smrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 0 30px}
.smb{height:50px;padding:0;font-size:26px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;filter:grayscale(.6);opacity:.75}
.smb span{font-size:10px;font-weight:700;color:var(--muted)}
.smb.on{filter:none;opacity:1;border-width:2px;transform:scale(1.04)}
.notetxt{margin:6px 0 0 30px;font-size:13px;background:#eef2ff;border-radius:8px;padding:5px 8px;white-space:pre-wrap}
</style>
</head>
<body>
<header class="top"><div><b>Notenbuch Deutsch</b> <span id="year" class="muted"></span></div><div class="row" style="gap:10px"><span id="syncind" data-act="syncnow" title="Synchronisation mit Dropbox"></span><span id="stand" class="muted"></span></div></header>
<main id="main"></main>
<nav class="tabs">
  <button data-act="tab" data-t="heute">📅<span>Heute</span></button>
  <button data-act="tab" data-t="uebersicht">📊<span>Übersicht</span></button>
  <button data-act="tab" data-t="ka">📝<span>Arbeiten</span></button>
  <button data-act="tab" data-t="einst">⚙️<span>Einstellungen</span></button>
</nav>
<div id="sheet" class="sheet-wrap hidden"><div class="backdrop" data-act="closesheet"></div><div class="sheet" id="sheetbody"></div></div>
<div id="lock" class="hidden"></div>
<div id="print"></div>
<input type="file" id="importfile" accept=".json,.txt,application/json,text/plain" hidden>

<script>
'use strict';
/* ================= Grundlagen ================= */
const GRADES = ['1+','1','1-','2+','2','2-','3+','3','3-','4+','4','4-','5+','5','5-','6'];
const QS = ['Q1','Q2','Q3','Q4'];
// Smileys für die mündliche Tagesnote: Note 1 bis 5
const SMILEYS = [['1','😀'],['2','🙂'],['3','😐'],['4','🙁'],['5','😣']];
const smiley = g => (SMILEYS.find(s => s[0] === g) || [])[1] || '';
const HJ = [{name:'1. Halbjahr', short:'HJ 1', qs:['Q1','Q2']}, {name:'2. Halbjahr', short:'HJ 2', qs:['Q3','Q4']}];
const WD = ['','Mo','Di','Mi','Do','Fr','Sa','So'];
const WDL = ['','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
// Unterrichtszeiten der Schule: Mo/Mi/Do 5 Stunden, Di/Fr 4 Stunden
const LONG_DAY = [['08:40','09:40'],['10:00','11:00'],['11:15','12:15'],['13:00','14:00'],['14:05','15:05']];
const SHORT_DAY = [['08:40','09:40'],['10:00','11:00'],['11:15','12:15'],['12:20','13:20']];
const BELL = {1: LONG_DAY, 2: SHORT_DAY, 3: LONG_DAY, 4: LONG_DAY, 5: SHORT_DAY};
const PERIODS = 5;
const periodTime = (w, p) => (BELL[w] || [])[p - 1] || null;
const timeStr = (w, p) => { const t = periodTime(w, p); return t ? t[0] + '–' + t[1] : ''; };
const KEY = 'notenbuch-deutsch-v1';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pts = g => { if (g == null || g === '') return null; const i = GRADES.indexOf(String(g)); return i < 0 ? null : 15 - i; };
const rnd = x => Math.min(15, Math.max(0, Math.floor(x + 0.5 + 1e-9)));   // x,5 wird aufgerundet (wie Excel RUNDEN)
const gradeOf = x => x == null ? '' : GRADES[15 - rnd(x)];
const gcls = g => { const p = pts(g); if (p == null) return ''; return p >= 13 ? 'g1' : p >= 10 ? 'g2' : p >= 7 ? 'g3' : p >= 4 ? 'g4' : 'g5'; };
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const fmtN = (x, d = 1) => x == null ? '' : x.toFixed(d).replace('.', ',');
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const today = () => iso(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const wd = s => { const x = parseISO(s).getDay(); return x === 0 ? 7 : x; };

function lessonsOn(d) {
  const out = new Map();
  for (const c of db.classes) for (const t of c.timetable) if (t.wd === wd(d)) {
    const k = lk(c.id, d, t.p); out.set(k, {c, p: t.p, key: k, L: db.lessons[k], planned: true});
  }
  for (const [k, L] of Object.entries(db.lessons)) if (L.date === d && !out.has(k)) {
    const c = cls(L.classId); if (c) out.set(k, {c, p: L.period, key: k, L, planned: false});
  }
  return [...out.values()].sort((a, b) => a.p - b.p);
}

function openLessons() {

  let d = db.settings.trackFrom || t, guard = 0;
  while (d <= t && guard++ < 400) {

        const k = lk(c.id, d, x.p);
        if (!lessonDone(db.lessons[k]) && lessonPhase(d, x.p) === 'past') res.push({c, d, p: x.p, key: k});

}
const toMin = s => { const [h, m] = (s || '0:0').split(':').map(Number); return h * 60 + m; };
const fromMin = n => String(Math.floor(n / 60) % 24).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');

// 'past' = Stunde ist vorbei, 'now' = läuft gerade, 'future' = kommt noch

  const tm = periodTime(wd(d), p); if (!tm) return 'past';

// Uhrzeit der Erinnerung an einem Wochentag (nach deiner letzten Stunde oder fest)

  if (!ps.length) return null;

function quarterStats(c, s, q) {
  let sum = 0, n = 0, hwY = 0, hwN = 0, abs = 0, mat = 0, late = 0, dist = 0; const items = [];

    if (g || a || m || note || l || st) items.push({d: L.date, g, a, m, note, l, st});
  }
  items.sort((a, b) => a.d < b.d ? -1 : 1);

  const override = (c.overrides[s.id] || {})[q] || '';

}
function calcStudent(c, s) {
  const r = {q: {}};
  for (const q of QS) r.q[q] = quarterStats(c, s, q);
  const w = (db.settings.oralWeight ?? 50) / 100;
  r.h = HJ.map(hj => {
    const mdl = avg(hj.qs.map(q => r.q[q].final).filter(x => x != null));
    let ws = 0, sum = 0;
    for (const e of c.exams.filter(e => hj.qs.includes(e.quarter))) {
      const p = pts((db.examGrades[e.id] || {})[s.id]);
      if (p != null) { ws += +e.weight || 1; sum += p * (+e.weight || 1); }
    }
    const schr = ws ? sum / ws : null;
    const tot = (mdl != null && schr != null) ? w * mdl + (1 - w) * schr : null;
    return {mdl, schr, tot};

  // Eine festgelegte Halbjahresnote zählt auch für die Jahresnote, weil diese aus den Zeugnisnoten entsteht.
  const ovs = c.overrides[s.id] || {};

  r.yearCalc = (r.h[0].tot != null && r.h[1].tot != null) ? 0.5 * rnd(r.h[0].tot) + 0.5 * rnd(r.h[1].tot) : null;
  r.yearOv = ovs.year || '';

  // Quartalsgesamtnote (Zwischenstand): mündlich des Quartals + Klassenarbeiten dieses Quartals, gleiche Gewichtung wie im Halbjahr.
  // Ohne Klassenarbeit im Quartal: nur mündlich (oralOnly). Fließt NICHT in die Halbjahresnote ein.
  for (const q of QS) {
    const o = r.q[q]; let ws = 0, sum = 0; const ex = [];
    for (const e of c.exams.filter(e => e.quarter === q)) {
      const g = (db.examGrades[e.id] || {})[s.id], p = pts(g);
      if (p != null) { ws += +e.weight || 1; sum += p * (+e.weight || 1); ex.push(`${e.title}: ${g}`); }

  return r;
}

// Tage für die Liste: Wochenenden ohne Einträge weglassen, Ferien zu einer Zeile zusammenfassen
function dayBlocks(from, to) {
  const out = []; let d = from;
  while (d <= to) {
    const w = wd(d), ls = lessonsOn(d), hol = holidayOf(d);
    if (w === 1 || d === from) out.push({week: isoWeek(d)});
    if (w > 5 && !ls.some(x => x.L)) { d = addDays(d, 1); continue; }
    if (hol && !ls.some(x => x.L)) {
      let e = d;
      while (addDays(e, 1) <= (hol.end || hol.start) && addDays(e, 1) <= to && !lessonsOn(addDays(e, 1)).some(x => x.L)) {
        e = addDays(e, 1); if (wd(e) === 1) break;
      }
      if (wd(e) === 1 && e !== d) e = addDays(e, -1);
      out.push({hol, from: d, to: e}); d = addDays(e, 1); continue;
    }
    out.push({d, ls}); d = addDays(d, 1);
  }
  // doppelte KW-Trenner (z. B. Woche nur mit Wochenende) entfernen
  return out.filter((b, i) => !(b.week && out[i + 1] && out[i + 1].week));

function isoWeek(s) {
  const d = parseISO(s); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));

  return 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7);
}

        : ph === 'future' ? '<span class="badge">kommt noch</span>' : '<span class="badge warn">offen</span>';
    }
    const now = lessonPhase(d, x.p) === 'now';
    return `<div class="card lesson" data-act="lesson" data-k="${x.key}"${now ? ' style="outline:2px solid var(--pri)"' : ''}><div class="per">${x.p}.</div><div class="grow"><b>${esc(x.c.name)}</b>${x.planned ? '' : ' <span class="muted small">(zusätzlich)</span>'}<div class="small muted">${timeStr(wd(d), x.p)}${L && L.topic ? ' · ' + esc(L.topic) : ''}</div></div>${st}</div>`;
}

    <button class="btn sm pri" data-act="random">🎲 Wer kommt dran?</button>

        <div class="icrow"><button class="ic${abs ? ' on-abs' : ''}" data-act="abs" data-s="${s.id}">🤒<span>krank</span></button>

        : `<div class="smrow">${SMILEYS.map(([sg, e]) => `<button class="smb${g === sg ? ' on ' + gcls(sg) : ''}" data-act="smile" data-s="${s.id}" data-g="${sg}">${e}<span>${sg}</span></button>`).join('')}</div>`}
    </div>`;

function kaCheck(c) {
  const cnt = q => c.exams.filter(e => e.quarter === q).length;
  const ok = QS.every(q => cnt(q) >= 1);
  return `<div class="banner ${ok ? 'ok' : ''} small">${ok ? '✓ Jedes Quartal hat mindestens eine Klassenarbeit.' : '⚠ Noch nicht jedem Quartal ist eine Klassenarbeit zugeordnet.'} &nbsp; ${QS.map(q => `${q}: ${cnt(q)}`).join(' · ')}</div>`;
}

function vOverview() {
  const c = curCls(); if (!c) return '<div class="card">Keine Lerngruppe.</div>';
  let h = pills('setcur', c.id) + kaCheck(c);
  if (!c.students.length) return h + `<div class="card muted">Noch keine Schüler:innen eingetragen.</div>`;
  const ws = warnings(c.id);
  if (ws.length) h += `<details class="card" style="padding:8px 12px"><summary style="cursor:pointer">⚠ <b>${ws.length}</b> ${ws.length > 1 ? 'Hinweise' : 'Hinweis'} in ${esc(c.name)}</summary>${warnList(ws)}</details>`;
  h += `<div class="row wrap" style="margin-bottom:10px"><button class="btn sm" data-act="confsheet">📋 Notenliste Zeugniskonferenz</button><button class="btn sm" data-act="printallsheet">🖨 Berichte für alle drucken</button></div>`;
  const ex = [examsOfHJ(c, 0), examsOfHJ(c, 1)];
  const span = i => 2 + ex[i].length + 2 + 3;
  let head1 = `<tr class="hj"><th class="nm"></th><th colspan="${span(0)}">1. Halbjahr</th><th colspan="${span(1)}">2. Halbjahr</th><th colspan="2">Ganzjahr</th><th colspan="5">Schuljahr gesamt</th></tr>`;
  let head2 = `<tr><th class="nm">Name</th>`;
  HJ.forEach((hj, i) => {
    head2 += hj.qs.map(q => `<th>${q}<span class="sub">mündl.</span></th>`).join('');
    head2 += ex[i].map(e => `<th>${esc(e.title)}<span class="sub">${e.quarter}${e.date ? ' · ' + fmtDL(e.date).slice(0, 6) : ''}</span></th>`).join('');
    head2 += hj.qs.map(q => `<th>${q}<span class="sub">gesamt</span></th>`).join('');
    head2 += `<th>Ø mdl.<span class="sub">Pkt.</span></th><th>Ø schr.<span class="sub">Pkt.</span></th><th>${hj.short}<span class="sub">Note</span></th>`;
  });
  head2 += `<th>Jahr<span class="sub">Note</span></th><th>🤒<span class="sub">krank</span></th><th>⏰<span class="sub">spät</span></th><th>🎒<span class="sub">Material</span></th><th>📢<span class="sub">Störung</span></th><th>📝<span class="sub">Notizen</span></th></tr>`;

  const cols = []; // für Klassenschnitt
  const rows = c.students.map(s => {
    const r = calcStudent(c, s); let k = 0, out = '';
    const put = (val, html, cl = '', f = '') => { (cols[k] ||= []); if (val != null) cols[k].push(val); k++; out += `<td class="${cl}${f ? ' edit' : ''}"${f ? ` data-act="ovcell" data-s="${s.id}" data-f="${f}"` : ''}>${html}</td>`; };
    HJ.forEach((hj, i) => {
      for (const q of hj.qs) { const o = r.q[q];
        put(o.final, o.final == null ? '' : `<b>${gradeOf(o.final)}${o.override ? '*' : ''}</b><span class="sub">${o.n ? `Ø ${fmtN(o.mean)} · ${o.n}×` : 'manuell'}</span>`, '', 'q:' + q); }
      for (const e of ex[i]) { const g = (db.examGrades[e.id] || {})[s.id]; put(pts(g), g ? `<b>${g}</b>` : '', '', 'exam:' + e.id); }
      for (const q of hj.qs) { const o = r.q[q];
        put(o.tot, o.tot == null ? '' : `<b>${gradeOf(o.tot)}${o.totOv ? '*' : ''}</b><span class="sub">${o.totOv ? 'ber. ' + (o.totCalc == null ? '–' : gradeOf(o.totCalc)) : o.oralOnly ? 'nur mdl.' : o.writtenOnly ? 'nur schr.' : fmtN(o.tot, 2) + ' P.'}</span>`, 'qres', 'tot:' + q); }
      put(r.h[i].mdl, fmtN(r.h[i].mdl, 2), 'calc');
      put(r.h[i].schr, fmtN(r.h[i].schr, 2), 'calc');
      put(r.h[i].tot, r.h[i].tot == null ? '' : `<b>${gradeOf(r.h[i].tot)}${r.h[i].ov ? '*' : ''}</b><span class="sub">${r.h[i].ov ? 'ber. ' + (r.h[i].calc == null ? '–' : fmtN(r.h[i].calc, 2) + ' P.') : fmtN(r.h[i].tot, 2) + ' P.'}</span>`, 'res', 'hj:' + i);
    });
    put(r.year, r.year == null ? '' : `<b>${gradeOf(r.year)}${r.yearOv ? '*' : ''}</b><span class="sub">${r.yearOv ? 'ber. ' + (r.yearCalc == null ? '–' : fmtN(r.yearCalc, 1) + ' P.') : fmtN(r.year, 1) + ' P.'}</span>`, 'res', 'year');
    const nNotes = QS.reduce((a, q) => a + r.q[q].items.filter(it => it.note).length, 0);
    out += `<td>${r.abs ? r.abs + '×' : ''}</td><td>${r.late ? r.late + '×' : ''}</td><td>${r.mat ? r.mat + '×' : ''}</td><td>${r.dist ? r.dist + '×' : ''}</td><td>${nNotes || ''}</td>`;
    return `<tr data-act="student" data-s="${s.id}"><td class="nm">${esc(s.name)} ${tagBadges(s)}</td>${out}</tr>`;
  });
  let avgRow = `<tr class="avg"><td class="nm">Klassenschnitt</td>`;
  for (let k = 0; k < cols.length; k++) { const a = avg(cols[k] || []); avgRow += `<td>${a == null ? '' : `${fmtN(a, 1)}<span class="sub">${gradeOf(a)}</span>`}</td>`; }
  avgRow += `<td></td><td></td><td></td><td></td><td></td></tr>`;
  h += `<div class="tbl-wrap"><table class="ov"><thead>${head1}${head2}</thead><tbody>${rows.join('')}${avgRow}</tbody></table></div>`;
  h += `<p class="help">Mündliche Quartalsnote = Ø der Tagesnoten (gerundet). * = von dir festgelegt. Quartal gesamt = ${db.settings.oralWeight} % mündlich + ${100 - db.settings.oralWeight} % Klassenarbeiten des Quartals (Zwischenstand; ohne Klassenarbeit nur mündlich). Halbjahr = ${db.settings.oralWeight} % mündlich + ${100 - db.settings.oralWeight} % schriftlich, Jahr = Ø der gerundeten Halbjahre. <b>Note antippen = von Hand ändern</b>, Name antippen = Details.</p>`;
  return h;
}

/* ---------- Schuljahreswechsel & Archiv ---------- */
const nextYear = y => { const m = String(y).match(/^(\d{4})\s*\/\s*(\d{2,4})$/); return m ? `${+m[1] + 1}/${String(+m[2].slice(-2) + 1).padStart(2, '0')}` : y; };
const bumpName = n => n.replace(/^(\d+)/, m => String(+m + 1));
const plusYear = d => { if (!d) return ''; const x = parseISO(d); x.setFullYear(x.getFullYear() + 1); return iso(x); };
function rolloverSheet() {
  const S = db.settings, ny = nextYear(S.year);
  showSheet(`<div class="row"><h2 class="grow">🎓 Neues Schuljahr</h2><button class="btn sm" data-act="closesheet">✕</button></div>
    <div class="banner small">Vorher bitte auf allen Geräten synchronisieren (☁️ ✓) bzw. eine Sicherung anlegen. Das Schuljahr ${esc(S.year)} wird archiviert und bleibt unter „Archiv“ lesbar.</div>
    <div class="field"><label>Neues Schuljahr</label><input id="ro-year" value="${esc(ny)}"></div>
    <div class="qgrid" style="margin-bottom:6px"><span></span><span class="small muted">Beginn</span><span class="small muted">Ende</span>
      ${S.quarters.map((q, i) => `<b>${q.id}</b><input type="date" id="ro-qs-${i}" value="${plusYear(q.start)}"><input type="date" id="ro-qe-${i}" value="${plusYear(q.end)}">`).join('')}</div>
    <p class="help">Vorschlag: Daten des alten Jahres + 1 Jahr. Bitte an die Termine deiner Schule anpassen (in NRW beginnt 2027/28 am 1.9.2027).</p>
    <h3>Lerngruppen übernehmen</h3>
    ${db.classes.map(c => `<div class="row" style="margin-bottom:6px"><input type="checkbox" id="ro-keep-${c.id}" checked><span class="small" style="width:70px">${esc(c.name)} →</span><input id="ro-name-${c.id}" value="${esc(bumpName(c.name))}" class="grow"><span class="small muted">${c.students.length} SuS</span></div>`).join('')}
    <label class="small" style="display:block;margin:8px 0 4px"><input type="checkbox" id="ro-tags" checked> Merkmale und Gesprächsprotokolle übernehmen</label>
    <label class="small" style="display:block;margin-bottom:10px"><input type="checkbox" id="ro-tt"> Stundenplan übernehmen (meist ändert er sich)</label>
    <button class="btn pri" style="width:100%" data-act="rolloverdo">Schuljahr wechseln</button>
    <p class="help">Nicht übernommen werden: Tagesnoten, Klassenarbeiten, Quartalsnoten, Gesprächsnotizen – die bleiben im Archiv.</p>`);
}
async function doRollover() {
  const S = db.settings, old = JSON.parse(JSON.stringify(db));
  const ny = $('#ro-year').value.trim() || nextYear(S.year);
  const quarters = S.quarters.map((q, i) => ({id: q.id, start: $('#ro-qs-' + i).value, end: $('#ro-qe-' + i).value}));
  if (quarters.some(q => !q.start || !q.end)) return alert('Bitte alle Quartalsdaten ausfüllen.');
  const keepTags = $('#ro-tags').checked, keepTT = $('#ro-tt').checked;
  const keep = db.classes.filter(c => $('#ro-keep-' + c.id).checked).map(c => ({c, name: $('#ro-name-' + c.id).value.trim() || c.name}));
  if (!confirm(`Schuljahr ${S.year} archivieren und ${ny} beginnen?\n\nÜbernommen: ${keep.map(k => k.name).join(', ') || 'keine Lerngruppen'}`)) return;
  await snapAdd('Vor dem Schuljahreswechsel');
  db.archives = [...(db.archives || []), {id: uid(), yearId: old.yearId, year: old.settings.year, at: Date.now(),
    data: {settings: old.settings, classes: old.classes, lessons: old.lessons, examGrades: old.examGrades, examMt: old.examMt}}];
  db.classes = keep.map(({c, name}) => Object.assign(newClass(name), {
    students: c.students.map(s => keepTags ? JSON.parse(JSON.stringify(s)) : {id: s.id, name: s.name}),
    timetable: keepTT ? JSON.parse(JSON.stringify(c.timetable)) : [],
    protocols: keepTags ? JSON.parse(JSON.stringify(c.protocols || {})) : {}}));
  db.lessons = {}; db.examGrades = {}; db.examMt = {};
  db.deleted = {lessons: {}, exams: {}, classes: {}, students: {}, archives: db.deleted.archives || {}};
  Object.assign(S, {year: ny, quarters, trackFrom: quarters[0].start});
  db.yearId = 'y:' + ny + ':' + uid();
  save(); closeSheet(); ui.cls = db.classes[0]?.id; ui.tab = 'einst'; render();
  toast(`Willkommen im Schuljahr ${ny}! Bitte Stundenplan prüfen.`);
}
function archiveDb(a) {
  return migrate({v: 1, updated: a.at, lastBackup: 0, yearId: a.yearId, archives: [], settings: JSON.parse(JSON.stringify(a.data.settings)),
    classes: JSON.parse(JSON.stringify(a.data.classes)), lessons: JSON.parse(JSON.stringify(a.data.lessons)),
    examGrades: JSON.parse(JSON.stringify(a.data.examGrades)), examMt: JSON.parse(JSON.stringify(a.data.examMt || {}))});
}
function viewArchive(id) {
  const a = db.archives.find(x => x.id === id); if (!a) return;
  ui.readonly = {year: a.year}; db = archiveDb(a); ui.cls = db.classes[0]?.id; ui.tab = 'uebersicht'; ui.lesson = null; ui.examId = null;
  window.scrollTo(0, 0); render(); toast(`Archiv ${a.year} – nur lesen`);
}
function exitArchive() { ui.readonly = null; db = load(); ui.cls = db.classes[0]?.id; ui.tab = 'einst'; ui.lesson = null; ui.examId = null; render(); }

/* ---------- Noten von Hand festlegen (pädagogisches Maß) ---------- */
function setOverride(c, sid, key, g) {
  const o = c.overrides[sid] ||= {};
  if (g) o[key] = g; else delete o[key];
  (c.ovMt ||= {})[sid + '|' + key] = Date.now();
}
function ovPicker(sid, f) {
  const c = curCls(), s = c.students.find(x => x.id === sid); if (!s) return;
  const r = calcStudent(c, s), back = !$('#sheet').classList.contains('hidden');
  let title, cur, calc = '', isExam = false;
  if (f.startsWith('exam:')) {
    const e = c.exams.find(x => x.id === f.slice(5)); isExam = true;
    title = e.title; cur = (db.examGrades[e.id] || {})[sid] || '';
  } else if (f.startsWith('q:')) {
    const o = r.q[f.slice(2)]; title = `${f.slice(2)} mündlich`; cur = o.override; calc = o.mean == null ? '' : `${gradeOf(o.mean)} (${fmtN(o.mean, 2)} P.)`;
  } else if (f.startsWith('tot:')) {
    const o = r.q[f.slice(4)]; title = `${f.slice(4)} gesamt`; cur = o.totOv; calc = o.totCalc == null ? '' : `${gradeOf(o.totCalc)} (${fmtN(o.totCalc, 2)} P.)`;
  } else if (f.startsWith('hj:')) {
    const h = r.h[+f.slice(3)]; title = `${HJ[+f.slice(3)].name}`; cur = h.ov; calc = h.calc == null ? '' : `${gradeOf(h.calc)} (${fmtN(h.calc, 2)} P.)`;
  } else { title = 'Jahresnote'; cur = r.yearOv; calc = r.yearCalc == null ? '' : `${gradeOf(r.yearCalc)} (${fmtN(r.yearCalc, 1)} P.)`; }
  ui.ovPick = {sid, f, back};
  showSheet(`<div class="row"><b class="grow" style="font-size:18px">${esc(s.name)} ${tagBadges(s)}</b><button class="btn sm" data-act="${back ? 'student' : 'closesheet'}" data-s="${sid}">${back ? '‹ Zurück' : '✕'}</button></div>
    <div class="small muted" style="margin-top:2px">${esc(title)}${isExam ? '' : ` · berechnet: <b>${calc || 'noch keine Daten'}</b>`}</div>

    ${isExam ? '' : '<div class="small muted">Deine Note ersetzt den berechneten Wert und wird mit * markiert. Eine festgelegte Halbjahresnote zählt auch für die Jahresnote.</div>'}`);
}

/* ---------- Notenspiegel & Mittelwert einer Klassenarbeit ---------- */
// NB (nicht bewertet) und fehlende Noten zählen nicht mit.
function examStats(c, e) {
  const m = db.examGrades[e.id] || {};
  const gs = c.students.map(s => m[s.id]).filter(Boolean);
  const valid = gs.filter(g => pts(g) != null);
  const dist = [0, 0, 0, 0, 0, 0];
  for (const g of valid) dist[+g[0] - 1]++;
  return {
    n: valid.length, nb: gs.filter(g => g === 'NB').length, missing: c.students.length - gs.length, dist,
    whole: valid.length ? valid.reduce((a, g) => a + +g[0], 0) / valid.length : null,   // Ø aus ganzen Noten (Notenspiegel)
    pAvg: avg(valid.map(pts)),                                                          // Ø mit Tendenzen, in Punkten
    under: dist[4] + dist[5],
  };
}
function examStatsCard(c, e) {
  const st = examStats(c, e);
  if (!st.n) return `<div class="card small muted">Notenspiegel und Durchschnitt erscheinen, sobald Noten eingetragen sind.</div>`;
  const max = Math.max(...st.dist);
  const cols = st.dist.map((n, i) => {
    const pct = Math.round(100 * n / st.n);
    return `<div class="nsp-col" tabindex="0" data-tip="Note ${i + 1}: ${n} ${n === 1 ? 'Arbeit' : 'Arbeiten'} (${pct} %)">
      <div class="nsp-val">${n || ''}</div><div class="nsp-bar" style="height:${n ? Math.max(3, 100 * n / max) : 0}%"></div></div>`;
  }).join('');
  const third = st.under > st.n / 3;
  return `<div class="card"><div class="row" style="margin-bottom:8px"><b class="grow">Notenspiegel</b><span class="small muted">${st.n} bewertet${st.nb ? ` · ${st.nb}× NB` : ''}${st.missing ? ` · ${st.missing} fehlen` : ''}</span></div>
    <div class="nsp" role="img" aria-label="Notenspiegel: ${st.dist.map((n, i) => `Note ${i + 1}: ${n}`).join(', ')}">${cols}</div>
    <div class="nsp-labs">${[1, 2, 3, 4, 5, 6].map(g => `<span>${g}</span>`).join('')}</div>
    <div class="row wrap" style="margin-top:12px;gap:10px">
      <div class="stat"><div class="stat-v">${fmtN(st.whole, 2)}</div><div class="stat-l">Notendurchschnitt<br>(ganze Noten)</div></div>
      <div class="stat"><div class="stat-v">${gradeOf(st.pAvg)}</div><div class="stat-l">Ø mit Tendenzen<br>${fmtN(st.pAvg, 1)} Punkte</div></div>
      <div class="stat"><div class="stat-v">${st.under}</div><div class="stat-l">mangelhaft /<br>ungenügend (${Math.round(100 * st.under / st.n)} %)</div></div></div>
    ${third ? `<div class="banner bad small" style="margin-top:10px">⚠ Mehr als ein Drittel ist mangelhaft oder ungenügend. In NRW entscheidet dann die Schulleitung, ob die Arbeit gewertet wird (APO-S I).</div>` : ''}
    <table class="nsp-table small"><tr><th>Note</th>${[1, 2, 3, 4, 5, 6].map(g => `<th>${g}</th>`).join('')}</tr><tr><td>Anzahl</td>${st.dist.map(n => `<td>${n}</td>`).join('')}</tr></table></div>`;
}

/* ---------- Verschlüsselung der Sicherungsdatei (AES-GCM 256, Schlüssel per PBKDF2 aus dem Passwort) ---------- */
const ENCKEY = 'notenbuch-enc', ENC_ITER = 310000;
let encCfg = null; try { encCfg = JSON.parse(localStorage.getItem(ENCKEY)); } catch (e) {}
const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
async function deriveKeyRaw(pw, saltB64, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: b64d(saltB64), iterations: iter}, base, 256);
  return b64e(new Uint8Array(bits));
}
const aesKey = raw => crypto.subtle.importKey('raw', b64d(raw), 'AES-GCM', false, ['encrypt', 'decrypt']);
async function encryptText(text) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await aesKey(encCfg.key), new TextEncoder().encode(text));
  // Nur der Zeitstempel bleibt lesbar (damit am PC die neueste Datei gefunden wird)
  return JSON.stringify({notenbuchEnc: 1, alg: 'AES-GCM-256 / PBKDF2-SHA256', iter: encCfg.iter, salt: encCfg.salt, iv: b64e(iv), updated: db.updated, data: b64e(new Uint8Array(ct))});
}
function askPassword(msg) {
  return new Promise(res => {
    showSheet(`<h2>🔐 Passwort</h2><div class="small" style="margin-bottom:8px">${esc(msg)}</div>
      <input id="pw-in" type="password" autocomplete="current-password" style="width:100%">
      <div class="row" style="margin-top:10px"><button class="btn pri grow" id="pw-ok">OK</button><button class="btn" id="pw-no">Abbrechen</button></div>`);
    const done = v => { closeSheet(); res(v); };
    $('#pw-ok').onclick = () => done($('#pw-in').value);
    $('#pw-no').onclick = () => done(null);
    $('#pw-in').onkeydown = e => { if (e.key === 'Enter') done($('#pw-in').value); };
    setTimeout(() => $('#pw-in').focus(), 50);
  });
}
const keyCache = {};
async function decryptBackup(w) {
  let raw = (encCfg && encCfg.salt === w.salt) ? encCfg.key : keyCache[w.salt];
  for (let i = 0; i < 3; i++) {
    if (!raw) {
      const pw = await askPassword(i ? 'Falsches Passwort – bitte erneut versuchen.' : 'Diese Sicherung ist verschlüsselt. Bitte das Passwort eingeben.');
      if (pw == null) throw new Error('abgebrochen');
      raw = await deriveKeyRaw(pw, w.salt, w.iter);
    }
    try {
      const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64d(w.iv)}, await aesKey(raw), b64d(w.data));
      keyCache[w.salt] = raw;
      if (!encCfg && confirm('Passwort auf diesem Gerät merken?\n\nDann musst du es hier nicht mehr eingeben, und Sicherungen von diesem Gerät werden ebenfalls verschlüsselt.')) {
        encCfg = {salt: w.salt, iter: w.iter, key: raw}; localStorage.setItem(ENCKEY, JSON.stringify(encCfg));
      }
      return new TextDecoder().decode(pt);
    } catch (e) { raw = null; }
  }
  throw new Error('Falsches Passwort');
}

// Zusammenführen zweier Stände: pro Stunde gewinnt die zuletzt bearbeitete Fassung, Gelöschtes bleibt gelöscht
function mergeDb(localDb, incomingDb) {
  const clone = x => JSON.parse(JSON.stringify(x));
  const A = migrate(clone(localDb)), B = migrate(clone(incomingDb));
  const delArch = {...A.deleted.archives, ...B.deleted.archives};
  const unionArchives = (base, other) => {
    for (const ar of other) if (!base.some(x => x.id === ar.id)) base.push(ar);
    return base.filter(ar => !delArch[ar.id]).sort((a, b) => a.at - b.at);
  };
  // Verschiedene Schuljahre: Das Gerät, das den Wechsel schon gemacht hat, gewinnt (das alte Jahr steckt in seinem Archiv)
  if (A.yearId !== B.yearId) {
    const aNewer = A.archives.some(x => x.yearId === B.yearId), bNewer = B.archives.some(x => x.yearId === A.yearId);
    const win = aNewer ? A : bNewer ? B : (A.updated >= B.updated ? A : B), lose = win === A ? B : A;
    const out = clone(win);
    out.archives = unionArchives(out.archives, lose.archives);
    out.deleted.archives = delArch;
    out.updated = Date.now(); out.lastBackup = localDb.lastBackup;
    return out;
  }
  const newer = B.updated > A.updated ? B : A, older = newer === A ? B : A;
  const del = {};
  for (const k of ['lessons', 'exams', 'classes', 'students']) {
    del[k] = {...A.deleted[k]};
    for (const [id, t] of Object.entries(B.deleted[k])) del[k][id] = Math.max(del[k][id] || 0, t);
  }
  const out = clone(newer); out.deleted = del;
  del.archives = delArch; out.archives = unionArchives(out.archives, older.archives);
  // Ferien: Vereinigung
  for (const h of older.settings.holidays) if (!out.settings.holidays.some(x => x.start === h.start && x.end === h.end)) out.settings.holidays.push(h);
  // Lerngruppen
  const ids = [...new Set([...newer.classes.map(c => c.id), ...older.classes.map(c => c.id)])];
  out.classes = [];
  for (const id of ids) {
    if (del.classes[id]) continue;
    const n = newer.classes.find(c => c.id === id), o = older.classes.find(c => c.id === id);
    if (!n || !o) { out.classes.push(clone(n || o)); continue; }
    const c = clone(n);
    for (const s of o.students) if (!c.students.some(x => x.id === s.id)) c.students.push(s);
    c.students = c.students.filter(s => !del.students[s.id]);
    for (const e of o.exams) if (!c.exams.some(x => x.id === e.id)) c.exams.push(e);
    c.exams = c.exams.filter(e => !del.exams[e.id]);
    for (const [sid, v] of Object.entries(o.overrides)) if (!c.overrides[sid]) c.overrides[sid] = v;
    // Festgelegte Noten: pro Note gewinnt die zuletzt vorgenommene Änderung (auch das Zurücksetzen auf „automatisch“)
    for (const k of new Set([...Object.keys(n.ovMt), ...Object.keys(o.ovMt)])) {
      const [sid, key] = k.split('|'), tn = n.ovMt[k] || 0, to = o.ovMt[k] || 0, src = to > tn ? o : n, val = (src.overrides[sid] || {})[key];
      c.ovMt[k] = Math.max(tn, to);
      if (val) (c.overrides[sid] ||= {})[key] = val; else if (c.overrides[sid]) delete c.overrides[sid][key];
    }
    for (const [sid, v] of Object.entries(o.talk)) if (!c.talk[sid] || (v.at || 0) > (c.talk[sid].at || 0)) c.talk[sid] = v;
    // Gesprächsprotokolle: pro Protokoll die zuletzt bearbeitete Fassung (Löschen = Markierung, damit es nicht zurückkommt)
    for (const [sid, arr] of Object.entries(o.protocols)) {
      const cur = c.protocols[sid] ||= [];
      for (const p of arr) { const i = cur.findIndex(x => x.id === p.id); if (i < 0) cur.push(p); else if ((p.mt || 0) > (cur[i].mt || 0)) cur[i] = p; }
    }
    out.classes.push(c);
  }
  // Stunden: zuletzt bearbeitete Fassung gewinnt
  out.lessons = {};
  for (const src of [older, newer]) for (const [k, L] of Object.entries(src.lessons)) {
    const cur = out.lessons[k];
    if (!cur || (L.mt || 0) >= (cur.mt || 0)) out.lessons[k] = L;
  }
  for (const [k, L] of Object.entries(out.lessons)) if (del.lessons[k] && del.lessons[k] >= (L.mt || 0)) delete out.lessons[k];
  // Klassenarbeitsnoten: pro Arbeit die zuletzt bearbeitete Fassung
  out.examGrades = {}; out.examMt = {};
  for (const src of [older, newer]) for (const [eid, m] of Object.entries(src.examGrades)) {
    const t = src.examMt[eid] || 0;
    if (!out.examGrades[eid] || t >= (out.examMt[eid] || 0)) { out.examGrades[eid] = m; out.examMt[eid] = t; }
  }
  for (const eid of Object.keys(del.exams)) { delete out.examGrades[eid]; delete out.examMt[eid]; }
  out.updated = Date.now(); out.lastBackup = localDb.lastBackup;
  return out;
}
async function doImport(mode) {
  const j = ui.pendingImport; if (!j) return;
  await snapAdd('Vor dem Laden einer Sicherung');
  const before = db;
  db = mode === 'merge' ? mergeDb(db, j) : migrate(j);
  saveQuiet(); ui.pendingImport = null; ui.lesson = null; ui.examId = null;
  if (!cls(ui.cls)) ui.cls = db.classes[0]?.id;
  closeSheet(); render();
  if (mode === 'merge') {
    const neu = Object.keys(db.lessons).filter(k => !before.lessons[k]).length;
    const upd = Object.keys(db.lessons).filter(k => before.lessons[k] && (before.lessons[k].mt || 0) !== (db.lessons[k].mt || 0)).length;
    toast(`Zusammengeführt: ${neu} neue, ${upd} aktualisierte Stunden`);
  } else toast('Sicherung geladen');
}

/* ---------- Wiederherstellungspunkte (IndexedDB, nur auf diesem Gerät) ---------- */
let idbP = null;
function idb() {
  return idbP ||= new Promise((res, rej) => {
    const r = indexedDB.open('notenbuch', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('snaps', {keyPath: 'id', autoIncrement: true}); r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbReq(store, mode, fn) {
  const d = await idb();
  return new Promise((res, rej) => { const t = d.transaction(store, mode), q = fn(t.objectStore(store)); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); });
}
const SNAP_MAX = 10;
async function snapAdd(label) {
  if (!hasData() || ui.readonly) return;
  try {
    await idbReq('snaps', 'readwrite', s => s.add({at: Date.now(), label, updated: db.updated, data: JSON.stringify(db)}));
    const all = (await idbReq('snaps', 'readonly', s => s.getAllKeys())) || [];
    const extra = all.sort((a, b) => a - b).slice(0, Math.max(0, all.length - SNAP_MAX));
    if (extra.length) await idbReq('snaps', 'readwrite', s => { extra.forEach(k => s.delete(k)); });
    localStorage.setItem('notenbuch-lastsnap', today());
  } catch (e) { console.warn('Wiederherstellungspunkt fehlgeschlagen', e); }
}
async function snapList() { return ((await idbReq('snaps', 'readonly', s => s.getAll())) || []).sort((a, b) => b.at - a.at); }
async function fillSnapList() {
  const el = $('#snaplist'); if (!el) return;

async function loadFromDir() {

/* ---------- Automatische Synchronisation über Dropbox ----------
   Anmeldung per OAuth mit PKCE (ohne Server, dauerhaft über Refresh-Token).
   Die App sieht nur ihren eigenen Ordner „Apps/<App-Name>“. Hochgeladen wird nur die verschlüsselte Sicherung. */
const DBXKEY = 'notenbuch-dbx', DBX_FILE = '/notenbuch-sync.json';
let dbx = null; try { dbx = JSON.parse(localStorage.getItem(DBXKEY)); } catch (e) {}
const dbxSave = () => localStorage.setItem(DBXKEY, JSON.stringify(dbx));

const redirectUri = () => location.origin + location.pathname;

async function dbxConnect(appKey) {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
  const state = b64url(crypto.getRandomValues(new Uint8Array(12)));
  localStorage.setItem('notenbuch-dbx-pkce', JSON.stringify({verifier, state, appKey}));
  location.href = 'https://www.dropbox.com/oauth2/authorize?' + new URLSearchParams({
    client_id: appKey, response_type: 'code', code_challenge: challenge, code_challenge_method: 'S256',
    token_access_type: 'offline', redirect_uri: redirectUri(), state});
}
async function dbxHandleRedirect() {
  const p = new URLSearchParams(location.search);
  if (!p.has('code') && !p.has('error')) return;
  history.replaceState(null, '', redirectUri());
  const pk = JSON.parse(localStorage.getItem('notenbuch-dbx-pkce') || 'null'); localStorage.removeItem('notenbuch-dbx-pkce');
  if (p.has('error')) return toast('Dropbox-Verbindung abgebrochen');
  if (!pk || pk.state !== p.get('state')) return alert('Die Dropbox-Anmeldung konnte nicht zugeordnet werden. Bitte noch einmal „Mit Dropbox verbinden“ tippen.');
  let j, r;
  try {
    r = await fetch('https://api.dropboxapi.com/oauth2/token', {method: 'POST', body: new URLSearchParams({
      code: p.get('code'), grant_type: 'authorization_code', client_id: pk.appKey, code_verifier: pk.verifier, redirect_uri: redirectUri()})});
    j = await r.json();
  } catch (e) { return alert('Keine Verbindung zu Dropbox. Besteht eine Internetverbindung?'); }
  if (!r.ok) return alert('Dropbox-Verbindung fehlgeschlagen: ' + (j.error_description || j.error || r.status));
  dbx = {appKey: pk.appKey, refresh: j.refresh_token, access: j.access_token, exp: Date.now() + (j.expires_in - 60) * 1000, rev: null, dirty: true, last: 0};
  dbxSave(); render(); toast('Mit Dropbox verbunden');
  await syncNow(true);
}
async function dbxToken() {
  if (dbx.access && Date.now() < dbx.exp) return dbx.access;
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', {method: 'POST', body: new URLSearchParams({grant_type: 'refresh_token', refresh_token: dbx.refresh, client_id: dbx.appKey})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (j.error === 'invalid_grant') { dbx.refresh = null; dbxSave(); render(); throw new Error('Die Dropbox-Verbindung ist abgelaufen – bitte in den Einstellungen neu verbinden.'); }
    throw new Error('Dropbox-Anmeldung: ' + (j.error_description || r.status));
  }
  dbx.access = j.access_token; dbx.exp = Date.now() + (j.expires_in - 60) * 1000; dbxSave();
  return dbx.access;
}
async function dbxApi(url, arg, body) {
  const headers = {Authorization: 'Bearer ' + await dbxToken()}, content = url.includes('content.dropboxapi');
  if (content) { headers['Dropbox-API-Arg'] = JSON.stringify(arg); if (body != null) headers['Content-Type'] = 'application/octet-stream'; }
  else headers['Content-Type'] = 'application/json';
  return fetch(url, {method: 'POST', headers, body: content ? body : JSON.stringify(arg)});
}
// Entschlüsseln der Datei aus Dropbox; auf einem neuen Gerät wird einmal nach dem Passwort gefragt
async function syncDecrypt(w, interactive) {
  if (!w.notenbuchEnc) return migrate(w);
  let raw = (encCfg && encCfg.salt === w.salt) ? encCfg.key : keyCache[w.salt];
  for (let i = 0; i < 3; i++) {
    if (!raw) {
      if (!interactive) throw new Error('Passwort nötig – bitte auf ☁️ tippen');
      const pw = await askPassword(i ? 'Falsches Passwort – bitte erneut versuchen.' : 'Die Daten in Dropbox sind verschlüsselt. Bitte das Passwort eingeben, das du auf dem anderen Gerät festgelegt hast.');
      if (pw == null) throw new Error('Passwort nicht eingegeben');
      raw = await deriveKeyRaw(pw, w.salt, w.iter);
    }
    try {
      const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64d(w.iv)}, await aesKey(raw), b64d(w.data));
      keyCache[w.salt] = raw;
      // beide Geräte verwenden denselben Schlüssel
      if (!encCfg || encCfg.salt !== w.salt) { encCfg = {salt: w.salt, iter: w.iter, key: raw}; localStorage.setItem(ENCKEY, JSON.stringify(encCfg)); }
      return migrate(JSON.parse(new TextDecoder().decode(pt)));
    } catch (e) { raw = null; if (!interactive) throw new Error('Passwort passt nicht zu den Daten in Dropbox – bitte auf ☁️ tippen'); }
  }
  throw new Error('Falsches Passwort');
}
const dataSig = d => JSON.stringify([d.lessons, d.examGrades, d.classes.map(c => [c.id, c.students, c.exams, c.timetable, c.overrides, c.talk])]);

async function syncNow(interactive) {
  if (!dbxOn() || syncState.busy || ui.readonly) return;
  if (!navigator.onLine) { syncState.err = 'offline – wird nachgeholt'; updSyncUi(); return; }
  syncState.busy = true; syncState.err = ''; updSyncUi();
  const sigBefore = dataSig(db);
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      // 1. Gibt es in Dropbox einen neueren Stand? → abholen und zusammenführen
      const m = await dbxApi('https://api.dropboxapi.com/2/files/get_metadata', {path: DBX_FILE});
      let remoteRev = null;
      if (m.ok) remoteRev = (await m.json()).rev;
      else if (m.status !== 409) throw new Error('Dropbox antwortet nicht (' + m.status + ')');
      if (remoteRev && remoteRev !== dbx.rev) {
        const d = await dbxApi('https://content.dropboxapi.com/2/files/download', {path: DBX_FILE});
        if (!d.ok) throw new Error('Herunterladen fehlgeschlagen (' + d.status + ')');
        const remote = await syncDecrypt(JSON.parse(await d.text()), interactive);
        // Gerät ohne eigene Einträge (z. B. frisch eingerichteter PC): Stand aus Dropbox komplett übernehmen,
        // sonst entstünden doppelte, leere Lerngruppen
        const empty = !db.classes.some(c => c.students.length) && !hasData();
        if (empty) { const keep = db.lastBackup; db = remote; db.lastBackup = keep; } else db = mergeDb(db, remote);
        persist(); dbx.rev = remoteRev; dbxSave();
      }
      // 2. Eigene Änderungen hochladen
      if (!dbx.dirty) break;
      if (!encCfg) throw new Error('Bitte zuerst die Verschlüsselung einschalten (Einstellungen → Daten)');
      const text = await encryptText(JSON.stringify(db));
      const mode = remoteRev ? {'.tag': 'update', update: remoteRev} : {'.tag': 'add'};
      const u = await dbxApi('https://content.dropboxapi.com/2/files/upload', {path: DBX_FILE, mode, mute: true, autorename: false}, new Blob([text]));
      if (u.status === 409) continue;   // anderes Gerät war schneller → erst abholen, dann erneut
      if (!u.ok) throw new Error('Hochladen fehlgeschlagen (' + u.status + ')');
      dbx.rev = (await u.json()).rev; dbx.dirty = false; dbxSave();
      break;
    }
    if (dbx.dirty) throw new Error('Gleichzeitige Änderung – wird gleich erneut versucht');
    dbx.last = Date.now(); dbxSave();
    if (dataSig(db) !== sigBefore) { render(); toast('☁️ Neue Einträge vom anderen Gerät übernommen'); }
    else if (interactive) toast('☁️ Alles synchronisiert');
  } catch (e) {
    syncState.err = e.message;
    if (interactive) alert('Synchronisation: ' + e.message);
    else if (dbx && dbx.dirty) scheduleSync(60000);
  } finally { syncState.busy = false; updSyncUi(); }
}
function updSyncUi() {
  const el = $('#syncind'); if (!el) return;
  if (!dbxOn()) { el.textContent = ''; return; }
  const t = dbx.last ? new Date(dbx.last).toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'}) : '–';
  el.textContent = syncState.busy ? '☁️ …' : syncState.err ? '☁️ ⚠' : dbx.dirty ? '☁️ ↑' : '☁️ ✓ ' + t;
  el.title = syncState.err || (dbx.dirty ? 'Änderungen werden hochgeladen' : 'Synchronisiert um ' + t);
}
async function dbxDisconnect() {
  try { await dbxApi('https://api.dropboxapi.com/2/auth/token/revoke', null); } catch (e) {}
  dbx = null; localStorage.removeItem(DBXKEY); render(); toast('Dropbox getrennt');
}

  for (let w = 1; w <= 5; w++) {
    const items = [];
    for (const c of db.classes) for (const t of c.timetable) if (t.wd === w) items.push({p: t.p, n: c.name});
    if (!items.length) continue;
    items.sort((a, b) => a.p - b.p);
    let d = today(); while (wd(d) !== w) d = addDays(d, 1);
    const tm = 'T' + reminderTime(w).replace(':', '') + '00', ex = [];
    for (const h of S.holidays) if (h.start) { let x = h.start; while (x <= (h.end || h.start)) { if (wd(x) === w && x >= d) ex.push(x.replace(/-/g, '') + tm); x = addDays(x, 1); } }
    const sum = 'Noten eintragen: ' + items.map(i => `${i.n} (${i.p}.)`).join(', ');
    L.push('BEGIN:VEVENT', `UID:notenbuch-${w}-${Date.now()}@notenbuch`, `DTSTAMP:${now}`, `DTSTART:${d.replace(/-/g, '')}${tm}`, 'DURATION:PT10M',
      `RRULE:FREQ=WEEKLY;BYDAY=${['', 'MO', 'TU', 'WE', 'TH', 'FR'][w]};UNTIL=${end}T235959`, ...(ex.length ? ['EXDATE:' + ex.join(',')] : []),
      `SUMMARY:${icsEsc(sum)}`, `DESCRIPTION:${icsEsc('Mündliche Noten und Hausaufgaben im Notenbuch eintragen.' + (location.protocol === 'https:' ? ' ' + location.href.split('#')[0] : ''))}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(sum)}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
    count++;
  }
  L.push('END:VCALENDAR');
  if (!count) return alert('Bitte zuerst einen Stundenplan eintragen.');
  downloadBlob(new Blob([L.join('\r\n')], {type: 'text/calendar'}), 'Notenbuch-Erinnerung.ics');
}

// „Nachname, Vorname“ oder „Vorname Nachname“
function nameParts(s) {
  if (s.name.includes(',')) { const [l, f] = s.name.split(','); return {first: (f || '').trim() || l.trim(), last: f ? l.trim() : ''}; }
  const t = s.name.trim().split(/\s+/); return {first: t[0], last: t.length > 1 ? t.slice(1).join(' ') : ''};
}
const firstName = s => nameParts(s).first.split(/\s+/)[0];
const fmtDS = s => { const d = parseISO(s); return d.getDate() + '.' + (d.getMonth() + 1) + '.'; };

// Fakten für Bericht, Offline-Text und KI aus denselben Zahlen
function studentFacts(c, s) {
  const r = calcStudent(c, s);
  const qs = QS.filter(q => r.q[q].n > 0 || r.q[q].override);
  const exams = c.exams.slice().sort((a, b) => (a.date || '9') < (b.date || '9') ? -1 : 1)
    .map(e => ({e, g: (db.examGrades[e.id] || {})[s.id]})).filter(x => x.g);
  const notes = QS.flatMap(q => r.q[q].items.filter(it => it.note));
  return {r, qs, exams, notes};
}

// Variante B: regelbasiert, komplett offline
function offlineTalkNotes(c, s) {
  const {r, qs, exams, notes} = studentFacts(c, s), fn = firstName(s);
  const oral = avg(qs.map(q => r.q[q].final).filter(x => x != null));
  const writ = exams.length ? avg(exams.map(x => pts(x.g))) : null;
  const nGrades = QS.reduce((a, q) => a + r.q[q].n, 0);
  const lvl = p => p >= 13 ? 'sehr gut' : p >= 10 ? 'gut' : p >= 7 ? 'befriedigend' : p >= 4 ? 'ausreichend' : 'nicht ausreichend';
  const L = [], strong = [], weak = [], talk = [], home = [];

  const stand = HJ.map((hj, i) => r.h[i].tot != null ? `${hj.short}: ${gradeOf(r.h[i].tot)}` : null).filter(Boolean);
  L.push('Kurzüberblick:');
  L.push(`• ${fn}: ${oral != null ? `mündlich ${lvl(oral)} (Ø ${gradeOf(oral)})` : 'noch keine mündlichen Noten'}${writ != null ? `, schriftlich ${lvl(writ)} (Ø ${gradeOf(writ)})` : ''}.${stand.length ? ' Stand ' + stand.join(', ') + '.' : ''}`);

  if (oral != null && oral >= 10) strong.push(`gute mündliche Mitarbeit (Ø ${gradeOf(oral)} aus ${nGrades} Tagesnoten)`);
  if (writ != null && writ >= 10) strong.push(`Klassenarbeiten im guten Bereich (${exams.map(x => `${x.e.title}: ${x.g}`).join(', ')})`);
  if (oral != null && oral < 7) weak.push(`mündliche Mitarbeit ausbaufähig (Ø ${gradeOf(oral)})`);
  if (writ != null && writ < 7) weak.push(`Klassenarbeiten unter „befriedigend“ (${exams.map(x => `${x.e.title}: ${x.g}`).join(', ')})`);
  if (oral != null && writ != null && Math.abs(oral - writ) >= 3)
    (oral > writ ? weak : strong).push(oral > writ ? 'mündlich deutlich stärker als schriftlich' : 'schriftlich deutlich stärker als mündlich');
  // Entwicklung über die Quartale
  const qv = qs.map(q => r.q[q].final).filter(x => x != null);
  if (qv.length >= 2) { const d = qv[qv.length - 1] - qv[0];
    if (d >= 2) strong.push(`mündlich verbessert (${qs[0]}: ${gradeOf(qv[0])} → ${qs[qs.length - 1]}: ${gradeOf(qv[qv.length - 1])})`);
    if (d <= -2) weak.push(`mündlich nachgelassen (${qs[0]}: ${gradeOf(qv[0])} → ${qs[qs.length - 1]}: ${gradeOf(qv[qv.length - 1])})`); }
  if (exams.length >= 2) { const d = pts(exams[exams.length - 1].g) - pts(exams[0].g);
    if (d >= 3) strong.push(`Klassenarbeiten verbessert (${exams[0].g} → ${exams[exams.length - 1].g})`);
    if (d <= -3) weak.push(`Klassenarbeiten verschlechtert (${exams[0].g} → ${exams[exams.length - 1].g})`); }
  if (r.mat >= 2) weak.push(`${r.mat}× Material vergessen`);
  if (r.late >= 2) weak.push(`${r.late}× verspätet`);
  if (r.dist >= 2) weak.push(`${r.dist}× den Unterricht gestört`);
  if (r.abs >= 3) weak.push(`${r.abs}× krank gefehlt`);
  if (r.mat === 0 && r.late === 0 && nGrades >= 3) strong.push('zuverlässig: Material immer dabei, pünktlich');

  L.push('', 'Stärken:'); L.push(...(strong.length ? strong.map(x => '• ' + x) : ['• (aus den Daten nicht erkennbar – eigene Beobachtung ergänzen)']));
  L.push('', 'Entwicklungsfelder:'); L.push(...(weak.length ? weak.map(x => '• ' + x) : ['• keine Auffälligkeiten in den Daten']));
  if (notes.length) { L.push('', 'Deine Notizen:'); L.push(...notes.map(it => `• ${fmtDS(it.d)} ${it.note}`)); }
  if (tagText(s)) { L.push('', 'Merkmale (beachten):'); L.push('• ' + tagText(s)); }
  const lastP = protosOf(c, s.id)[0];
  if (lastP) { L.push('', 'Letztes Gespräch:'); L.push(`• ${fmtDS(lastP.date)} ${lastP.kind}${lastP.agreed ? ' – vereinbart: ' + lastP.agreed : ''}`); }

  if (strong.length) talk.push(`Mit dem Positiven beginnen: ${strong[0]}.`);
  if (oral != null && oral < 7) { talk.push(`Wie erleben Sie ${fn} zu Hause – traut sich ${fn}, vor anderen zu sprechen?`); home.push('beim Abendessen vom Schultag oder einem Buch erzählen lassen'); }
  if (writ != null && writ < 7) { talk.push('Gemeinsam schauen: Woran lag es in den Klassenarbeiten (Rechtschreibung, Textverständnis, Zeit)?'); home.push('regelmäßig (täglich 15 Min.) lesen, kurze Texte schreiben und gemeinsam überarbeiten'); }
  if (r.mat >= 2) { talk.push('Material ansprechen: Gibt es eine feste Routine zum Ranzenpacken?'); home.push('Ranzen am Vorabend nach Stundenplan packen'); }
  if (r.dist >= 2) talk.push('Unterrichtsstörungen ansprechen: In welchen Situationen passiert es, und was könnte helfen?');
  if (r.late >= 2) talk.push('Verspätungen ansprechen: Gibt es Gründe (Schulweg, Bus)?');
  if (r.abs >= 3) talk.push('Fehlzeiten: Wie wird verpasster Stoff nachgeholt?');
  if (nGrades < 3) talk.push('Wenige mündliche Noten – eigene Eindrücke aus dem Unterricht ergänzen.');
  if (!weak.length) talk.push(`Lob weitergeben und fragen, was ${fn} im Fach Freude macht.`);
  L.push('', 'Gesprächspunkte:'); L.push(...talk.map(x => '• ' + x));
  if (home.length) { L.push('', 'Vorschläge für zu Hause:'); L.push(...home.map(x => '• ' + x)); }
  return L.join('\n');
}

// Variante A: KI (optional) – nur pseudonymisierte Daten verlassen das Gerät
const AIKEY = 'notenbuch-ai';
let aiCfg = null; try { aiCfg = JSON.parse(localStorage.getItem(AIKEY)); } catch (e) {}
const AI_MODEL = 'claude-opus-5-5';
const AI_SYSTEM = `Du hilfst einer Deutschlehrkraft, ein Gespräch am Elternsprechtag vorzubereiten. Du bekommst pseudonymisierte Daten zu einem Kind; es heißt in den Daten [NAME], sein Familienname (z. B. bei den Eltern) ist [FAMILIENNAME], andere Kinder heißen [MITSCHÜLER:IN]. Übernimm diese Platzhalter unverändert.

Schreibe Gesprächsnotizen für die Lehrkraft auf Deutsch, stichpunktartig, mit genau diesen Abschnitten (jeweils eine Zeile mit Doppelpunkt als Überschrift, darunter Zeilen mit „• “):
Kurzüberblick:
Stärken:
Entwicklungsfelder:
Gesprächspunkte:
Vorschläge für zu Hause:

Regeln:
- Nutze nur die gelieferten Daten. Erfinde keine Ereignisse, Ursachen, Diagnosen oder Familienumstände. Wenn die Daten für eine Aussage zu dünn sind, schreib das.
- Bei „Gesprächspunkte“ gib wertschätzende, konkrete Formulierungen oder Fragen an die Eltern, ohne Fachjargon.
- Notensystem: 1 = sehr gut bis 6 = ungenügend; Punkte 15 = 1+ bis 0 = 6. Tagesnoten sind mündliche Eindrücke (1 bis 5).
- Kein Markdown (keine #, keine **), höchstens etwa 250 Wörter.
- Verwende für das Kind immer „[NAME]“.`;

function pseudonymize(c, s, text) {
  const reps = [];
  for (const st of c.students) {
    const own = st.id === s.id, {first, last} = nameParts(st);
    const add = (p, tag) => p.split(/[,\s]+/).concat([p]).map(x => x.trim()).filter(x => x.length >= 3).forEach(x => reps.push([x, tag]));
    reps.push([st.name.trim(), own ? '[NAME] [FAMILIENNAME]' : '[MITSCHÜLER:IN]']);
    if (last) reps.push([`${first} ${last}`, own ? '[NAME] [FAMILIENNAME]' : '[MITSCHÜLER:IN]']);
    add(first, own ? '[NAME]' : '[MITSCHÜLER:IN]');
    if (last) add(last, own ? '[FAMILIENNAME]' : '[MITSCHÜLER:IN]');
  }
  // längere Treffer zuerst; bei gleichem Text gewinnt der erste Eintrag (vollständiger Name)
  const seen = new Set(); reps.splice(0, reps.length, ...reps.filter(([p]) => !seen.has(p.toLowerCase()) && seen.add(p.toLowerCase())));
  reps.sort((a, b) => b[0].length - a[0].length);
  for (const [p, tag] of reps) {
    const re = new RegExp(`(?<![\\p{L}])${p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(?![\\p{L}])`, 'giu');
    text = text.replace(re, tag);
  }
  return text;
}
function aiPayload(c, s) {
  const {r, exams, notes} = studentFacts(c, s);
  const grade = (c.name.match(/\d+/) || [''])[0];
  const L = [`Fach: Deutsch${grade ? `, Jahrgangsstufe ${grade}` : ''}, Schuljahr ${db.settings.year}`, '', 'Mündliche Mitarbeit je Quartal:'];
  for (const q of QS) { const o = r.q[q]; if (!o.n && !o.abs && !o.mat && !o.late && !o.dist && !o.override) continue;
    L.push(`- ${q}: ${o.final != null ? `Note ${gradeOf(o.final)}${o.override ? ' (von der Lehrkraft festgelegt)' : ''}` : 'keine Note'}${o.n ? `, Ø ${fmtN(o.mean, 1)} Punkte aus ${o.n} Tagesnoten` : ''}; krank ${o.abs}×, verspätet ${o.late}×, Material vergessen ${o.mat}×, Unterricht gestört ${o.dist}×`);
    const g = o.items.filter(it => it.g).map(it => `${fmtDS(it.d)} ${it.g}`); if (g.length) L.push(`  Tagesnoten: ${g.join(', ')}`); }
  L.push('', 'Klassenarbeiten:'); L.push(...(exams.length ? exams.map(x => `- ${x.e.title} (${x.e.quarter}${x.e.date ? ', ' + fmtDS(x.e.date) : ''}): ${x.g}`) : ['- noch keine']));
  L.push('', 'Halbjahres-/Jahresnoten:'); HJ.forEach((hj, i) => L.push(`- ${hj.name}: ${r.h[i].tot != null ? `${gradeOf(r.h[i].tot)} (${fmtN(r.h[i].tot, 1)} Punkte; mündlich ${fmtN(r.h[i].mdl, 1)}, schriftlich ${fmtN(r.h[i].schr, 1)})` : 'noch offen'}`));
  L.push('', 'Notizen der Lehrkraft:'); L.push(...(notes.length ? notes.map(it => `- ${fmtDS(it.d)}: ${it.note}`) : ['- keine']));
  return pseudonymize(c, s, L.join('\n'));
}
async function aiTalkNotes(c, s, payload) {
  let Anthropic;
  try { ({default: Anthropic} = await import('https://esm.sh/@anthropic-ai/sdk')); }
  catch (e) { throw new Error('Die KI-Bibliothek konnte nicht geladen werden. Besteht eine Internetverbindung?'); }
  const client = new Anthropic({apiKey: aiCfg.key, dangerouslyAllowBrowser: true});
  let resp;
  try {
    resp = await client.beta.messages.create({
      model: AI_MODEL, max_tokens: 16000,
      betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default',
      output_config: {effort: 'low'},
      system: AI_SYSTEM,
      messages: [{role: 'user', content: payload}],
    });
  } catch (e) {
    if (e instanceof Anthropic.AuthenticationError) throw new Error('Der API-Schlüssel ist ungültig (Einstellungen → KI).');
    if (e instanceof Anthropic.RateLimitError) throw new Error('Zu viele Anfragen – bitte kurz warten und erneut versuchen.');
    if (e instanceof Anthropic.APIConnectionError) throw new Error('Keine Verbindung zur KI. Besteht eine Internetverbindung?');
    if (e instanceof Anthropic.APIError) throw new Error(`Fehler der KI (${e.status || '?'}): ${e.message}`);
    throw e;
  }
  if (resp.stop_reason === 'refusal') throw new Error('Die KI hat die Anfrage abgelehnt. Bitte die Offline-Variante verwenden.');
  const text = resp.content.filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
  if (!text) throw new Error('Die KI hat keinen Text geliefert.');
  return text.replace(/\[NAME\]/g, firstName(s)).replace(/\[FAMILIENNAME\]/g, nameParts(s).last || '');
}

/* ================= Wer kommt dran? ================= */
// Zufall, aber fair: Wer im Quartal wenige Tagesnoten hat, wird deutlich häufiger gezogen.
function randomPick() {
  const [cid, d] = ui.lesson.split('|'), c = cls(cid), L = db.lessons[ui.lesson] || {grades: {}, absent: {}}, q = quarterOf(d);
  let cand = c.students.filter(s => !(L.absent || {})[s.id] && !(L.grades || {})[s.id]);
  if (cand.length > 1) cand = cand.filter(s => s.id !== ui.lastPick);
  if (!cand.length) return toast('Alle Anwesenden haben heute schon einen Smiley');
  const w = cand.map(s => 1 / Math.pow(1 + (q ? quarterStats(c, s, q).n : 0), 2));
  let x = Math.random() * w.reduce((a, b) => a + b, 0), i = 0;
  while (x > w[i] && i < w.length - 1) x -= w[i++];
  const s = cand[i], n = q ? quarterStats(c, s, q).n : 0;
  ui.lastPick = s.id;
  showSheet(`<div class="row"><b class="grow muted">🎲 Wer kommt dran?</b><button class="btn sm" data-act="closesheet">✕</button></div>
    <div class="pick-name">${esc(s.name)}</div>
    <div class="small muted" style="text-align:center">${q ? `im ${q} bisher ${n} Tagesnote${n === 1 ? '' : 'n'}` : ''}</div>
    <div class="smrow" style="margin:14px 0 10px">${SMILEYS.map(([g, e]) => `<button class="smb" data-act="picksmile" data-s="${s.id}" data-g="${g}">${e}<span>${g}</span></button>`).join('')}</div>
    <div class="row"><button class="btn grow" data-act="random">🎲 Andere Person</button></div>`);
}

/* ================= Hinweise ================= */
function warnings(onlyCid) {
  const t = today(), q = quarterOf(t);
  // fällige Wiedervorlagen aus Gesprächsprotokollen (auch außerhalb der Quartale)
  const due = [];
  for (const c of db.classes) if (!onlyCid || c.id === onlyCid) for (const s of c.students)
    for (const p of protosOf(c, s.id)) if (p.follow && !p.done && p.follow <= t) due.push({c, s, icon: '📅', txt: `Wiedervorlage: ${p.kind} vom ${fmtDL(p.date)}${p.agreed ? ' – ' + p.agreed.slice(0, 60) : ''}`});
  if (!q) return due;
  const S = db.settings, Q = S.quarters.find(x => x.id === q);
  const elapsed = (parseISO(t) - parseISO(Q.start)) / Math.max(1, parseISO(Q.end) - parseISO(Q.start));
  const hi = HJ.findIndex(h => h.qs.includes(q)), hj = HJ[hi], out = due;
  for (const c of db.classes) {
    if (onlyCid && c.id !== onlyCid) continue;
    for (const s of c.students) {
      const r = calcStudent(c, s), o = r.q[q];
      const mat = hj.qs.reduce((a, x) => a + r.q[x].mat, 0), late = hj.qs.reduce((a, x) => a + r.q[x].late, 0), dist = hj.qs.reduce((a, x) => a + r.q[x].dist, 0);
      if (o.final != null && o.final <= 3) out.push({c, s, icon: '📉', txt: `steht mündlich im ${q} auf ${gradeOf(o.final)}`});
      else if (r.h[hi].tot != null && rnd(r.h[hi].tot) <= 3) out.push({c, s, icon: '📉', txt: `steht im ${hj.short} auf ${gradeOf(r.h[hi].tot)}`});
      if (+S.warnMinGrades > 0 && elapsed >= 0.5 && o.n < +S.warnMinGrades) out.push({c, s, icon: '🔍', txt: `hat im ${q} erst ${o.n} Tagesnote${o.n === 1 ? '' : 'n'}`});
      if (+S.warnMat > 0 && mat >= +S.warnMat) out.push({c, s, icon: '🎒', txt: `hat im ${hj.name} ${mat}× Material vergessen`});
      if (+S.warnDist > 0 && dist >= +S.warnDist) out.push({c, s, icon: '📢', txt: `hat im ${hj.name} ${dist}× den Unterricht gestört`});
      if (+S.warnLate > 0 && late >= +S.warnLate) out.push({c, s, icon: '⏰', txt: `kam im ${hj.name} ${late}× zu spät`});
    }
  }
  return out;
}
const warnList = ws => ws.map(w => `<div class="warn-item" data-act="warnopen" data-c="${w.c.id}" data-s="${w.s.id}"><span>${w.icon}</span><div class="grow"><b>${esc(w.s.name)}</b> <span class="muted small">${esc(w.c.name)}</span><div class="small">${esc(w.txt)}</div></div><span class="muted">›</span></div>`).join('');

// „knapp“ = ungerundete Punkte liegen höchstens 0,25 von der Rundungsgrenze x,5 entfernt
const isClose = p => p != null && Math.abs((p - Math.floor(p)) - 0.5) <= 0.25;
const altGrade = p => gradeOf(p - Math.floor(p) >= 0.5 ? Math.floor(p) : Math.floor(p) + 1);
function conferenceHtml(c, which) {
  const hi = which === 'hj1' ? 0 : 1, hj = HJ[hi], year = which === 'jahr';
  const rows = c.students.map((s, i) => ({i, s, r: calcStudent(c, s)}));
  const key = x => year ? x.r.year : x.r.h[hi].tot;
  const dist = {}; for (const x of rows) { const p = key(x); if (p != null) { const g = gradeOf(p)[0]; dist[g] = (dist[g] || 0) + 1; } }
  const pp = x => x == null ? '–' : fmtN(x, 2);
  let h = `<div class="rep conf"><h1>Notenliste Deutsch – ${esc(c.name)}</h1><div>${year ? 'Schuljahr' : hj.name} ${esc(db.settings.year)} · Stand ${new Date().toLocaleDateString('de-DE')} · mündlich ${db.settings.oralWeight} % / schriftlich ${100 - db.settings.oralWeight} %</div>
    <table style="margin-top:8px"><tr><th>Nr.</th><th>Name</th>${hj.qs.map(q => `<th>${q} mdl.</th>`).join('')}<th>Ø mdl.</th><th>Ø schr.</th><th>${hj.short} Pkt.</th><th>${hj.short} Note</th>${year ? `<th>${HJ[0].short} Note</th><th>Jahr Pkt.</th><th>Jahresnote</th>` : ''}<th>krank</th><th>Bemerkung</th></tr>`;
  for (const x of rows) {
    const r = x.r, h2 = r.h[hi], p = key(x), close = isClose(p);
    const abs = hj.qs.reduce((a, q) => a + r.q[q].abs, 0) + (year ? HJ[0].qs.reduce((a, q) => a + r.q[q].abs, 0) : 0);
    h += `<tr${close ? ' class="close"' : ''}><td>${x.i + 1}</td><td>${esc(x.s.name)}</td>${hj.qs.map(q => `<td>${r.q[q].final == null ? '–' : gradeOf(r.q[q].final) + (r.q[q].override ? '*' : '')}</td>`).join('')}
      <td>${pp(h2.mdl)}</td><td>${pp(h2.schr)}</td><td>${pp(h2.calc)}</td><td><b>${h2.tot == null ? '–' : gradeOf(h2.tot) + (h2.ov ? '*' : '')}</b></td>
      ${year ? `<td>${r.h[0].tot == null ? '–' : gradeOf(r.h[0].tot) + (r.h[0].ov ? '*' : '')}</td><td>${pp(r.yearCalc)}</td><td><b>${r.year == null ? '–' : gradeOf(r.year) + (r.yearOv ? '*' : '')}</b></td>` : ''}
      <td>${abs || ''}</td><td>${[(x.s.tags || []).map(t => (TAGS.find(d => d[0] === t) || [])[1]).filter(Boolean).join(', '), (year ? r.yearOv : h2.ov) ? `* festgelegt (berechnet: ${(year ? r.yearCalc : h2.calc) == null ? '–' : gradeOf(year ? r.yearCalc : h2.calc)})` : '', close ? `⚖ knapp – auch ${altGrade(p)} vertretbar` : ''].filter(Boolean).join(' · ')}</td></tr>`;
  }
  h += `</table><h2>Notenspiegel</h2><table style="width:auto"><tr>${['1', '2', '3', '4', '5', '6'].map(g => `<th style="text-align:center;width:44px">${g}</th>`).join('')}<th>Ø</th></tr>
    <tr>${['1', '2', '3', '4', '5', '6'].map(g => `<td style="text-align:center">${dist[g] || 0}</td>`).join('')}<td>${(() => { const a = avg(rows.map(key).filter(x => x != null)); return a == null ? '–' : `${fmtN(a, 1)} P. (${gradeOf(a)})`; })()}</td></tr></table>
    <p style="font-size:9pt">⚖ knapp = die ungerundeten Punkte liegen höchstens 0,25 von der Rundungsgrenze entfernt. * = Note von der Lehrkraft festgelegt (Punkte = berechneter Wert).</p></div>`;
  return h;
}
